name: Security

on:
  push:
    # develop included, and it is the point. This ran on main and staging only,
    # which is where the work is not: the branch every commit lands on was the
    # one branch never scanned, for as long as the job existed.
    branches: [develop, test, staging, main]
  pull_request:
    branches: [develop, test, staging, main]
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # A job that declares any permission gets only what it declares, and
      # this one declared none for the repository itself. That was invisible
      # while the repository was public -- an anonymous checkout works there --
      # and became a "repository not found" on every run from 2026-09-05,
      # when it went private. `actions: read` is what CodeQL asks for on a
      # private repository so that it can read workflow runs.
      contents: read
      actions: read
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, not just the tip. A credential committed and then
          # removed in a later commit is still published -- the fix is rotation,
          # and this is what tells us rotation is needed.
          fetch-depth: 0
      # The gitleaks binary is MIT-licensed; only the marketplace action wrapper
      # requires a paid licence for organizations, and it refuses to run without
      # one -- so the job this replaced could not have been scanning anything.
      - name: Install gitleaks
        run: |
          version=8.28.0
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL -o /tmp/gitleaks.tar.gz "$base/v$version/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan history for secrets
        # --max-archive-depth because the default is 0: gitleaks does not look
        # inside archives at all unless asked, and it decides what is an archive
        # from the file extension. This repository holds real provider tokens in
        # an ignored .env and machine keys under private-keys/, so the scan
        # matters here as much as in anything it generates.
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --max-archive-depth 3

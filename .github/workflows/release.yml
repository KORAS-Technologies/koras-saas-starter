name: Release

on:
  push:
    branches: [main]
    paths:
      - "generators/create-koras-app/**"
      - "profiles/**"

jobs:
  release:
    name: Publish generator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No `version:` here. package.json's packageManager field pins
      # pnpm@9.15.0, and action-setup treats a version input as a second,
      # competing declaration -- it fails outright with "Multiple versions of
      # pnpm specified" rather than picking one. One pin, in the file the
      # local toolchain already reads.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build generator
        run: pnpm turbo run build --filter=create-koras-app

      # Placeholder — publishing logic implemented in Phase 11
      - name: Publish (stub)
        run: echo "Release publishing implemented in Phase 11"

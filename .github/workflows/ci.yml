name: CI

on:
  push:
    branches: [develop, test, staging, main]
  pull_request:
    branches: [develop, test, staging, main]
  # Lets a person run CI without pushing. Added while diagnosing why this
  # workflow had never produced a single run: a manual trigger separates
  # "the event never fired" from "runs are blocked", which nothing else here
  # could distinguish. Worth keeping either way.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here. package.json's packageManager field pins
      # pnpm@9.15.0, and action-setup treats a version input as a second,
      # competing declaration -- it fails outright with "Multiple versions of
      # pnpm specified" rather than picking one. One pin, in the file the
      # local toolchain already reads.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

  test-node:
    name: Test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The service-descriptor tests run the deploy workflow's discovery script
      # AND the real Terraform module over one corpus, and require the same
      # answer from both. They need Terraform, which the runner image does not
      # carry (jq and yq it does). With CI set they fail rather than skip when
      # a tool is missing: a skipped parity test is a green check that proves
      # nothing. The module declares no provider, so this needs no credentials.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Test
        run: pnpm turbo run test

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy .

      - name: Test
        run: uv run pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

  # docs/framework-baseline.yaml must keep naming a commit that exists and is
  # in this branch's history, so the accepted baseline cannot rot silently.
  # Needs the full history; a shallow checkout cannot answer an ancestry question.
  framework-baseline:
    name: Framework baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Accepted baseline resolves and is an ancestor of HEAD
        run: node scripts/check-framework-baseline.mjs
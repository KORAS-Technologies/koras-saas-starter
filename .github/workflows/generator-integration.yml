name: Generator Integration

# Generates both profiles and builds what comes out.
#
# This job echoed its own command for as long as it existed, under a comment
# saying the real version would arrive in Phase 11, and reported green the whole
# time. What it did not catch, in order of how long each shipped broken:
#
#   - the control-plane profile did not typecheck as generated. packages/auth
#     imported isPlatformRole from a permissions package that was a two-line
#     stub, declared neither jose nor the workspace dependency, and the admin
#     application imported an api-client it never listed.
#   - a fresh product could not start its API: settings.py declares ENVIRONMENT
#     with no default and .env.local.example never set it.
#   - eight of eleven derived settings named Terraform outputs no product emits.
#
# All three were invisible to the 393 unit tests, because those read the files
# the generator wrote and never ran the result. The only way to catch this class
# is to build the output, so that is what this does.
#
# It is slow — install and build for two projects — which is why it runs on
# changes to the generator or the profiles rather than on every commit.

on:
  push:
    branches: [develop, test, staging, main]
    paths:
      - "generators/**"
      - "profiles/**"
      - "infrastructure/terraform/modules/**"
      - ".github/workflows/generator-integration.yml"
  pull_request:
    paths:
      - "generators/**"
      - "profiles/**"
      - "infrastructure/terraform/modules/**"
      - ".github/workflows/generator-integration.yml"
  workflow_dispatch:

concurrency:
  group: generator-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-build:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The row-level security suite needs a database. It is the one part of the
    # generated output that cannot be checked by reading it: RLS is enforced by
    # the server against the connecting role, so the only thing that can answer
    # "are these policies applied" is a server applying them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rlstest
          POSTGRES_DB: koras_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      # Both profiles always run. A failure in one is not a reason to stop
      # learning whether the other is also broken — they diverge constantly, and
      # that divergence is the thing this job exists to measure.
      fail-fast: false
      matrix:
        include:
          - profile: product
            slug: integration-product
            # Policies do the scoping here, so the strict checks apply.
            rls_flags: ""
          - profile: control-plane
            slug: integration-control-plane
            # No tenant model and no policies: RLS is a deny-by-default
            # backstop and the service role is meant to bypass it. Forcing it
            # would deny the owner too and every query would return nothing.
            rls_flags: "-v deny_all_by_default=1"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v6

      - name: Install starter dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the generator
        run: pnpm turbo run build --filter=create-koras-app

      # Outside the starter, because generating into it is refused — and because
      # a project written inside the repository would be picked up by the
      # starter's own workspace globs on the next step.
      - name: Generate
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          pnpm create-koras-app "${{ matrix.slug }}" \
            --profile "${{ matrix.profile }}" \
            --no-interactive \
            --output-dir "$RUNNER_TEMP/generated"

      # Not --frozen-lockfile: the generated project has no lockfile, and one
      # committed to the template would pin whatever the template's dependency
      # ranges resolved to on the day it was written.
      - name: Install the generated project
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm install --no-frozen-lockfile

      # turbo, so workspace packages build before the applications importing
      # them. This is the step that fails when a package is a stub or a
      # dependency is undeclared.
      - name: Build
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run build

      # Phase 11 asks for generated projects to pass a lint check, and until
      # now nothing ran one -- the workflow built, typechecked and tested what
      # it generated, so a lint rule broken in a template reached every
      # generated repository and was found by whoever generated one next.
      - name: Lint
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run lint

      - name: Typecheck
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run typecheck

      - name: Test (Node)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run test


      # The row-level security suite, executed rather than shipped.
      #
      # `force row level security` binds the table owner and does nothing to a
      # superuser or a BYPASSRLS role, so a schema can have correct policies,
      # force on every table, and no isolation at all. The structural suite
      # catches the first; `app_role` makes it check the second. Both were
      # verified by mutation before this step existed -- removing force, and
      # naming a superuser, each make it exit non-zero. See R-032.
      - name: Row-level security suite
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          PGPASSWORD: rlstest
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: koras_rls
        run: |
          set -euo pipefail

          for file in supabase/migrations/*.sql; do
            echo "--> migration $(basename "$file")"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done

          # The suite must run as a role RLS actually applies to. Guarded by a
          # DO block so a re-run is not an error.
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'koras_rls_test') then
              create role koras_rls_test nologin nobypassrls;
            end if;
          end
          $$;
          grant usage on schema public to koras_rls_test;
          grant select, insert, update, delete on all tables in schema public to koras_rls_test;
          SQL

          for file in supabase/tests/*.sql; do
            echo "--> test $(basename "$file")"
            psql -v ON_ERROR_STOP=1 -v app_role=koras_rls_test ${{ matrix.rls_flags }} -q -f "$file"
          done

      # A suite that cannot fail proves nothing, and this one had never been
      # asked to. Dropping `force` must make it exit non-zero; if it does not,
      # the step above has been passing vacuously.
      # Only where force is expected. The Control Plane has none to remove, and
      # asserting that its suite fails without one would assert the opposite of
      # what that schema means.
      - name: The suite catches a removed force
        if: matrix.profile == 'product'
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          PGPASSWORD: rlstest
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: koras_rls
        run: |
          set -uo pipefail
          psql -v ON_ERROR_STOP=1 -q -t -A -c "
            select 'alter table ' || n.nspname || '.' || c.relname || ' no force row level security;'
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity" | psql -q -v ON_ERROR_STOP=1

          if psql -v ON_ERROR_STOP=1 -q -f supabase/tests/010_rls_structure.sql >/dev/null 2>&1; then
            echo "::error::The RLS suite passed with force removed. It is not asserting anything."
            exit 1
          fi
          echo "The suite correctly refuses a schema whose owner bypasses its policies."

      # --all-packages installs every workspace member. A bare `uv sync` brings
      # in only the root dev tools, leaving mypy unable to resolve fastapi and
      # pydantic — and silently treating them as Any.
      - name: Install Python packages
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv sync --all-packages

      # One pass. This was a loop over service roots, because every service
      # named its package `src` and a repo-wide run aborted on duplicate
      # modules; they are named after themselves now.
      # Ruff on generated output, which nothing ran until 2026-08-25. The
      # generated projects' own CI runs it, but that only ever executes inside a
      # generated repository -- so a lint rule broken in a template was invisible
      # here. It was: a fresh product reported 40 ruff errors, 19 of them in
      # vendored skills the project does not own and should never have linted.
      - name: Lint (Python)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv run ruff check .

      - name: Typecheck (Python)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv run mypy python-packages services

      # tests/security/test_no_state_artifacts.py asks git what is tracked, so
      # the project has to be a repository before it means anything. A generated
      # project is not one: the generator only runs `git init` after a
      # successful provision, so a generate-only project fails two of the tests
      # it ships with. That is a real defect and it is recorded separately —
      # this cannot be fixed by initialising at generation time, because
      # initAndPushToDevelop refuses to push into a directory that already has
      # a .git and would silently stop pushing anything.
      #
      # Staged rather than merely initialised: `git ls-files` is empty in a
      # fresh repository, so without `add` the first test passes over nothing
      # and proves the opposite of what it claims.
      - name: Make it a repository, so the security check has something to read
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: |
          git init -q -b develop
          git add -A

      - name: Test (Python)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv run pytest

      # A project generated a moment ago must match what the generator would
      # produce for it. If it does not, either the drift check is wrong or
      # generation is not deterministic, and both are worth failing over —
      # this check is the one that tells an existing project it is behind.
      - name: Drift check reports nothing
        run: |
          pnpm create-koras-app "${{ matrix.slug }}" \
            --profile "${{ matrix.profile }}" \
            --no-interactive \
            --check-drift --all \
            --output-dir "$RUNNER_TEMP/generated"

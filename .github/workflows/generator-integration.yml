name: Generator Integration

# Generates both profiles and builds what comes out.
#
# This job echoed its own command for as long as it existed, under a comment
# saying the real version would arrive in Phase 11, and reported green the whole
# time. What it did not catch, in order of how long each shipped broken:
#
#   - the control-plane profile did not typecheck as generated. packages/auth
#     imported isPlatformRole from a permissions package that was a two-line
#     stub, declared neither jose nor the workspace dependency, and the admin
#     application imported an api-client it never listed.
#   - a fresh product could not start its API: settings.py declares ENVIRONMENT
#     with no default and .env.local.example never set it.
#   - eight of eleven derived settings named Terraform outputs no product emits.
#
# All three were invisible to the 393 unit tests, because those read the files
# the generator wrote and never ran the result. The only way to catch this class
# is to build the output, so that is what this does.
#
# It is slow — install and build for two projects — which is why it runs on
# changes to the generator or the profiles rather than on every commit.

on:
  push:
    branches: [develop, test, staging, main]
    paths:
      - "generators/**"
      - "profiles/**"
      - "infrastructure/terraform/modules/**"
      - ".github/workflows/generator-integration.yml"
  pull_request:
    paths:
      - "generators/**"
      - "profiles/**"
      - "infrastructure/terraform/modules/**"
      - ".github/workflows/generator-integration.yml"
  workflow_dispatch:

concurrency:
  group: generator-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-build:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The row-level security suite needs a database. It is the one part of the
    # generated output that cannot be checked by reading it: RLS is enforced by
    # the server against the connecting role, so the only thing that can answer
    # "are these policies applied" is a server applying them.
    services:
      postgres:
        # pgvector's image is Postgres 16 with the extension the product's
        # knowledge table needs; Supabase ships it, and plain Postgres does not.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: rlstest
          POSTGRES_DB: koras_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      # Both profiles always run. A failure in one is not a reason to stop
      # learning whether the other is also broken — they diverge constantly, and
      # that divergence is the thing this job exists to measure.
      fail-fast: false
      matrix:
        include:
          - profile: product
            slug: integration-product
            # Policies do the scoping here, so the strict checks apply.
            rls_flags: ""
            components: ""
            # Owns the round trip: a real database, this product's own API and
            # a local identity provider, so a change can be shown to reach
            # storage and come back. Stated positively and per entry, because
            # the condition was once "every slug except the minimal one" --
            # which silently included the Control Plane, whose template has no
            # `e2e/support/seed.sql` and never could.
            roundtrip: true
          # Optional components, which no run generated until 2026-08-25 and
          # which nothing therefore checked. Both defects found on the day this
          # entry was added were in templates only these flags select: the
          # scheduler failed its own typecheck, and the AI gateway discarded the
          # coroutine that reads its config. See SYNC_BACKLOG D5.
          #
          # **`data_import` joined them on 2026-09-22, and it had never been
          # generated by any row.** It is off by default and no entry named it,
          # so the whole feature -- two tables, eight routes, a parser fed files
          # from outside the product and the commit that writes a customer's
          # records -- was checked by template-reading assertions alone. Phase 2
          # shipped with a commit path that could not succeed once, and this is
          # part of why every gate was green over it. This row owns the round
          # trip, so naming it here is also what runs
          # `tests/integration/test_import_commit_rls.py` against a real
          # database. IMP2-01 in `docs/features/data-import/phase-2-review.md`.
          - profile: product
            slug: integration-product-full
            rls_flags: ""
            components: "--with marketing,ai_gateway,scheduler,ai,data_import"
            # Also owns it: the optional components change the shell the round
            # trip signs in to, and this is the only row that generates them.
            roundtrip: true
          # The other direction. Removing a component must leave a project that
          # still builds -- a workspace reference to something no longer
          # generated fails here rather than for whoever passed the flag.
          # `reporting` is on by default, so this is the row that proves a
          # product without it still builds and its registry tests still pass.
          - profile: product
            slug: integration-product-minimal
            rls_flags: ""
            components: "--without admin,worker,reporting"
            # No worker and no reporting, so there is no send sweep and no
            # scheduled delivery for a round trip to exercise. This row exists
            # to prove such a project still builds; it runs no browser at all.
            roundtrip: false
          - profile: control-plane
            slug: integration-control-plane
            # No tenant model and no policies: RLS is a deny-by-default
            # backstop and the service role is meant to bypass it. Forcing it
            # would deny the owner too and every query would return nothing.
            rls_flags: "-v deny_all_by_default=1"
            components: ""
            # The Control Plane has no round trip and no fixture for one: its
            # template carries `e2e/support/session.ts` and neither the seed nor
            # the local identity provider the product's harness starts. Its own
            # browser suite still runs, against its own degraded shell.
            roundtrip: false

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v6

      - name: Install starter dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the generator
        run: pnpm turbo run build --filter=create-koras-app

      # Outside the starter, because generating into it is refused — and because
      # a project written inside the repository would be picked up by the
      # starter's own workspace globs on the next step.
      - name: Generate
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          pnpm create-koras-app "${{ matrix.slug }}" \
            --profile "${{ matrix.profile }}" \
            ${{ matrix.components }} \
            --no-interactive \
            --output-dir "$RUNNER_TEMP/generated"

      # Not --frozen-lockfile: the generated project has no lockfile, and one
      # committed to the template would pin whatever the template's dependency
      # ranges resolved to on the day it was written.
      - name: Install the generated project
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm install --no-frozen-lockfile

      # turbo, so workspace packages build before the applications importing
      # them. This is the step that fails when a package is a stub or a
      # dependency is undeclared.
      - name: Build
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run build

      # Phase 11 asks for generated projects to pass a lint check, and until
      # now nothing ran one -- the workflow built, typechecked and tested what
      # it generated, so a lint rule broken in a template reached every
      # generated repository and was found by whoever generated one next.
      - name: Lint
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run lint

      - name: Typecheck
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run typecheck

      - name: Test (Node)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm turbo run test

      # The one step in this workflow that opens a browser.
      #
      # Everything above asserts structure, which is the right shape for what a
      # caller is *allowed* to see and cannot say anything about a focus trap,
      # Escape returning focus, or an icon-only link keeping its accessible
      # name. Those are claims the product shell makes about itself, and until
      # this step existed nothing in any KORAS repository had ever checked one.
      #
      # Both profiles carry one. The suites are authored in the templates and
      # run here, in the factory, against a project generated moments ago —
      # which is FOLLOW_UPS F18's decision: a browser test needs a running
      # application, so it lives with the application and the factory runs the
      # generated copy. A harness kept in the starter would have to generate a
      # project first to have anything to open, at the cost this job pays anyway.
      #
      # The product suite covers the shell's interaction — a focus trap, Escape
      # returning focus, an icon-only link keeping its accessible name. The
      # control-plane suite covers the admin middleware, which is the one
      # authorisation layer no unit test can reach: it runs before routing, on a
      # request that has not become a page yet.
      #
      # `--without admin,worker` is excluded: the control-plane suite needs the
      # admin application and that row removes it, which is the row's whole
      # point.
      - name: Install a browser
        if: matrix.slug != 'integration-product-minimal'
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: pnpm e2e:install

      # The round trip's own database, and the role the API insists on.
      #
      # Separate from `koras_rls` above so the two suites cannot see each
      # other's rows: a browser test that wrote into the schema the isolation
      # suite reads would make one of them fail for the other's reasons.
      #
      # `nobypassrls` is not a preference. The API refuses to start on a
      # connection whose role is granted BYPASSRLS -- "every tenant policy is
      # inert and queries can return other tenants' rows" -- and connecting as
      # `postgres` would have produced a suite where every isolation assertion
      # passed vacuously. Its own guard caught that the first time this ran.
      - name: Prepare the round-trip database
        if: matrix.roundtrip
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          PGPASSWORD: rlstest
          PGHOST: localhost
          PGUSER: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -d postgres \
            -c "drop database if exists koras_e2e" -c "create database koras_e2e"

          export PGDATABASE=koras_e2e
          for file in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -q -f e2e/support/seed.sql

      # A declared import target, for the length of one run.
      #
      # **Without this, nothing in this estate renders the import page.**
      # `ImportPanel` returns its no-targets banner and stops when a product
      # declares none, and a generated product declares none -- correctly,
      # because a target names a table the product owns and the starter owns no
      # domain. So the picker, the mapping, the result card, the report and the
      # confirm control were protected by assertions that read template text and
      # by nothing else, which is how Phase 2 shipped a commit path that could
      # not succeed once and a report a customer could not reach after a reload.
      #
      # The fixture lives in `.github/fixtures/`, which is inside no template:
      # `create-koras-app` cannot copy it and no generated product contains it.
      # It declares no writer and no table, so it adds no domain to anything --
      # what it buys is everything up to the commit, and the commit is covered
      # by `tests/integration/test_import_commit_rls.py` against a real
      # PostgreSQL instead.
      - name: Declare an import target, so the page has something to draw
        if: matrix.roundtrip && contains(matrix.components, 'data_import')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          PGPASSWORD: rlstest
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: koras_e2e
        run: |
          set -euo pipefail
          # Kept, because the product's own is put back below. It has to be:
          # `tests/integration/test_import_commit_rls.py` asserts that
          # `TARGETS` is empty -- the guard that the starter never grows a
          # domain of its own -- and that assertion is worth more than the
          # convenience of leaving the fixture in place.
          cp services/api/koras_api/imports/targets.py             "$RUNNER_TEMP/targets.py.product"
          cp "$GITHUB_WORKSPACE/.github/fixtures/import-target.py"             services/api/koras_api/imports/targets.py
          psql -v ON_ERROR_STOP=1 -q -f "$GITHUB_WORKSPACE/.github/fixtures/import-run.sql"

      - name: End-to-end (browser)
        if: matrix.slug != 'integration-product-minimal'
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          # Its presence is what starts the identity provider and the API and
          # adds the `roundtrip` project. Absent -- which is every developer's
          # laptop, and every row above that does not own the round trip -- the
          # suite is exactly what it was.
          #
          # Empty rather than unset for a row without it, because a step cannot
          # conditionally omit an environment key. The config reads `?? ''` and
          # treats empty as absent, which is the same path a laptop takes.
          E2E_DATABASE_URL: ${{ matrix.roundtrip && 'postgresql+asyncpg://koras_e2e_app:koras_e2e_app@localhost:5432/koras_e2e' || '' }}
          # How `e2e/roundtrip/imports.spec.ts` knows a target was declared. It
          # skips without this rather than asserting against a page that renders
          # a banner, which would be a suite reporting success for a surface it
          # never drew.
          E2E_IMPORT_FIXTURE: ${{ (matrix.roundtrip && contains(matrix.components, 'data_import')) && '1' || '' }}
        run: pnpm e2e

      # The trace that explains a failure, which is the half `koras-control-plane`'s
      # own workflow was missing: it uploaded a report directory its reporter
      # never produced, so every failure was read from a text log.
      - name: Keep the trace when it fails
        if: failure() && matrix.slug != 'integration-product-minimal'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.slug }}
          path: ${{ runner.temp }}/generated/${{ matrix.slug }}/playwright-report/
          retention-days: 7

      # The fixture is for the browser and for nothing else.
      #
      # `always()`, because a browser failure must not also make every later
      # step run against a product carrying a target it does not declare -- the
      # Python suite asserts that `TARGETS` is empty, and the drift check
      # compares the project against what the generator would produce for it.
      # Both would fail for the fixture's reasons rather than their own, which
      # is the failure mode that costs an afternoon.
      - name: Put the product-s own targets back
        if: always() && matrix.roundtrip && contains(matrix.components, 'data_import')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/targets.py.product" ]; then
            cp "$RUNNER_TEMP/targets.py.product"               services/api/koras_api/imports/targets.py
          fi


      # The row-level security suite, executed rather than shipped.
      #
      # `force row level security` binds the table owner and does nothing to a
      # superuser or a BYPASSRLS role, so a schema can have correct policies,
      # force on every table, and no isolation at all. The structural suite
      # catches the first; `app_role` makes it check the second. Both were
      # verified by mutation before this step existed -- removing force, and
      # naming a superuser, each make it exit non-zero. See R-032.
      - name: Row-level security suite
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          PGPASSWORD: rlstest
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: koras_rls
        run: |
          set -euo pipefail

          for file in supabase/migrations/*.sql; do
            echo "--> migration $(basename "$file")"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done

          # The suite must run as a role RLS actually applies to. Guarded by a
          # DO block so a re-run is not an error.
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'koras_rls_test') then
              create role koras_rls_test nologin nobypassrls;
            end if;
          end
          $$;
          grant usage on schema public to koras_rls_test;
          grant select, insert, update, delete on all tables in schema public to koras_rls_test;
          SQL

          for file in supabase/tests/*.sql; do
            echo "--> test $(basename "$file")"
            psql -v ON_ERROR_STOP=1 -v app_role=koras_rls_test ${{ matrix.rls_flags }} -q -f "$file"
          done

      # A suite that cannot fail proves nothing, and this one had never been
      # asked to. Dropping `force` must make it exit non-zero; if it does not,
      # the step above has been passing vacuously.
      # Only where force is expected. The Control Plane has none to remove, and
      # asserting that its suite fails without one would assert the opposite of
      # what that schema means.
      - name: The suite catches a removed force
        if: matrix.profile == 'product'
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          PGPASSWORD: rlstest
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: koras_rls
        run: |
          set -uo pipefail
          psql -v ON_ERROR_STOP=1 -q -t -A -c "
            select 'alter table ' || n.nspname || '.' || c.relname || ' no force row level security;'
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity" | psql -q -v ON_ERROR_STOP=1

          if psql -v ON_ERROR_STOP=1 -q -f supabase/tests/010_rls_structure.sql >/dev/null 2>&1; then
            echo "::error::The RLS suite passed with force removed. It is not asserting anything."
            exit 1
          fi
          echo "The suite correctly refuses a schema whose owner bypasses its policies."

      # --all-packages installs every workspace member. A bare `uv sync` brings
      # in only the root dev tools, leaving mypy unable to resolve fastapi and
      # pydantic — and silently treating them as Any.
      - name: Install Python packages
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv sync --all-packages

      # One pass. This was a loop over service roots, because every service
      # named its package `src` and a repo-wide run aborted on duplicate
      # modules; they are named after themselves now.
      # Ruff on generated output, which nothing ran until 2026-08-25. The
      # generated projects' own CI runs it, but that only ever executes inside a
      # generated repository -- so a lint rule broken in a template was invisible
      # here. It was: a fresh product reported 40 ruff errors, 19 of them in
      # vendored skills the project does not own and should never have linted.
      - name: Lint (Python)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv run ruff check .

      - name: Typecheck (Python)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: uv run mypy python-packages services

      # Boot the AI gateway, because typecheck never starts it. The two defects
      # this component shipped -- a discarded config coroutine and a telemetry
      # callback with no dependency -- both passed mypy and would have failed on
      # the first request. This starts the LiteLLM proxy with throwaway keys and
      # asks its liveness endpoint, which answers without calling any provider.
      - name: Smoke the AI gateway (boots and serves)
        if: contains(matrix.components, 'ai_gateway')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}/services/ai-gateway
        env:
          OPENAI_API_KEY: sk-smoke-not-real
          ANTHROPIC_API_KEY: sk-smoke-not-real
          GEMINI_API_KEY: sk-smoke-not-real
          OPENROUTER_API_KEY: sk-smoke-not-real
          LITELLM_MASTER_KEY: sk-smoke-master
          # The deploy injects the whole product's Doppler env into every
          # service, so the gateway boots with these set. LiteLLM enables its
          # Prisma key store on sight of DATABASE_URL and crashes without
          # prisma installed; the smoke only catches that if it boots the same
          # way the container does. It did not, and a deploy timed out for it.
          DATABASE_URL: postgresql://smoke:smoke@127.0.0.1:5/smoke
          REDIS_URL: redis://127.0.0.1:6/0
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python -m koras_ai_gateway.main &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1; then
              echo "The AI gateway booted and answered liveness."
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::The AI gateway process exited before serving."
              exit 1
            fi
            sleep 2
          done
          echo "::error::The AI gateway did not answer liveness within two minutes."
          exit 1

      # tests/security/test_no_state_artifacts.py asks git what is tracked, so
      # the project has to be a repository before it means anything. A generated
      # project is not one: the generator only runs `git init` after a
      # successful provision, so a generate-only project fails two of the tests
      # it ships with. That is a real defect and it is recorded separately —
      # this cannot be fixed by initialising at generation time, because
      # initAndPushToDevelop refuses to push into a directory that already has
      # a .git and would silently stop pushing anything.
      #
      # Staged rather than merely initialised: `git ls-files` is empty in a
      # fresh repository, so without `add` the first test passes over nothing
      # and proves the opposite of what it claims.
      - name: Make it a repository, so the security check has something to read
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: |
          git init -q -b develop
          git add -A

      # `E2E_DATABASE_URL` for the rows that prepared one above, and empty for
      # the rows that did not. It is the same switch the browser step uses and
      # deliberately the same variable: `tests/integration/` skips without it,
      # so a developer with no Postgres runs exactly what they ran before.
      #
      # It exists because the data-import commit shipped with a defect no other
      # kind of test could see -- the worker's tenant context is
      # transaction-local, so committing the claim silently dropped it and every
      # row-level policy then matched nothing. That reproduces against a real
      # database and a role without BYPASSRLS, and against nothing else.
      # IMP2-01 in `docs/features/data-import/phase-2-review.md`.
      - name: Test (Python)
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          E2E_DATABASE_URL: ${{ matrix.roundtrip && 'postgresql+asyncpg://koras_e2e_app:koras_e2e_app@localhost:5432/koras_e2e' || '' }}
        run: uv run pytest

      # The import memory suites, asked for by name, and not allowed to skip.
      #
      # Both read the kernel's peak resident set from `/proc`, so both skip on
      # any platform without one -- which is right on a laptop and would be a
      # silent hole here: the step above reports a skip as a pass, and these
      # are the only tests in the estate that measure what GR-352 is about.
      # `test_preflight_memory.py` is the safety pass's own memory (GR-352A);
      # `test_import_inspection_memory.py` is the analysis route's, through
      # `core/imports.analyse` (GR-352B); `test_import_worker_memory.py` is
      # the worker's, through `core/imports.examine` and `prepare` (GR-352C).
      # A runner that stops being Linux, or a marker that starts matching it,
      # fails this step rather than passing over nothing.
      #
      # `test_import_worker_envelope.py` reads nothing from `/proc` and skips
      # nowhere. It is named here so that the one-import-at-a-time guard, the
      # read's time budget and the cancellation that stops it are things this
      # step is known to have run, rather than things the step above ran
      # somewhere among two thousand others.
      - name: The import memory suites ran, and none of them skipped
        if: contains(matrix.components, 'data_import')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: |
          uv run pytest \
            python-packages/koras-import/tests/test_preflight_memory.py \
            tests/unit/test_import_inspection_memory.py \
            tests/unit/test_import_worker_memory.py \
            tests/unit/test_import_worker_envelope.py \
            --no-cov -q -rs | tee "$RUNNER_TEMP/import-memory.txt"
          if grep -E -q '[0-9]+ skipped' "$RUNNER_TEMP/import-memory.txt"; then
            echo "::error::an import memory test was skipped; on this runner every one of them must run"
            exit 1
          fi
          grep -E -q '[0-9]+ passed' "$RUNNER_TEMP/import-memory.txt"

      # The commit's all-or-nothing, counted in rows, and not allowed to skip.
      #
      # GR-352C changed how the worker reads a file -- rows as a stream, on a
      # thread, under a budget, with the queue's cancellation passed on -- and
      # the one property none of that may touch is a property of a
      # transaction. `tests/integration/` skips without a database, and the
      # `Test (Python)` step above reports that as a pass, so the row that
      # prepared one asks for these two by name.
      - name: The import commit ran against a database, and did not skip
        if: matrix.roundtrip && contains(matrix.components, 'data_import')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          E2E_DATABASE_URL: postgresql+asyncpg://koras_e2e_app:koras_e2e_app@localhost:5432/koras_e2e
        run: |
          uv run pytest \
            tests/integration/test_import_commit_rls.py \
            tests/integration/test_import_commit_atomic.py \
            --no-cov -q -rs | tee "$RUNNER_TEMP/import-commit.txt"
          if grep -E -q '[0-9]+ skipped' "$RUNNER_TEMP/import-commit.txt"; then
            echo "::error::an import commit test was skipped; this row has a database and every one of them must run"
            exit 1
          fi
          grep -E -q '[0-9]+ passed' "$RUNNER_TEMP/import-commit.txt"

      # What may be heavy in a worker at once, asked of the product's own
      # jobs, and not allowed to skip.
      #
      # GR-352E. An import measured beside a cross-provider backup, in the
      # product's own image under the 512 MiB it is deployed with, reached the
      # limit. So an import, a backup's copy, a restore and a scheduled report
      # share one gate, and a scheduled report carries no more rows than an
      # export does.
      #
      # `test_worker_heavy_sections.py` runs each pair of those jobs through
      # its real function and counts how many hold a payload at once; a job a
      # product was generated without is skipped inside it, which is right for
      # that product and would be a hole here. This is the row that has all
      # four -- `data_import` asked for, and the worker, reporting and storage
      # governance on by default -- so here a skip is a failure.
      - name: The heavy-job gate and the report bound ran, and nothing skipped
        if: contains(matrix.components, 'data_import')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        run: |
          uv run pytest \
            tests/unit/test_worker_heavy_gate.py \
            tests/unit/test_worker_heavy_sections.py \
            tests/unit/test_reporting_delivery_bound.py \
            tests/unit/test_worker_image_contents.py \
            --no-cov -q -rs | tee "$RUNNER_TEMP/heavy-gate.txt"
          if grep -E -q '[0-9]+ skipped' "$RUNNER_TEMP/heavy-gate.txt"; then
            echo "::error::a heavy-gate test was skipped; this row has every job the gate holds and every one of them must run"
            exit 1
          fi
          grep -E -q '[0-9]+ passed' "$RUNNER_TEMP/heavy-gate.txt"

      # The worker's own image, built and run with nothing mounted.
      #
      # **Every other step in this job runs where the whole source tree is on
      # the path, and a deployed worker does not.** It runs in an image that
      # carries the worker, the shared packages and a handful of API files the
      # Dockerfile copies one line at a time. On 2026-10-02 that image was run
      # for the first time, to measure memory, and the audit sink in it
      # imported a module the image had never carried -- after it had
      # committed. Every dry run in a deployed worker was a failed job over a
      # run already `validated`, every commit logged that it could not be
      # witnessed, and every gate here was green. IMPORT-DEF-020.
      #
      # So the image is built from the generated Dockerfile, a worker is
      # started from it by its own command, and `worker_image_probe.py` is fed
      # to a second container of it on standard input -- no volume, no bind
      # mount -- to load every module the worker names and to take a dry run
      # and a commit from first line to last against this row's database.
      #
      # `--network host`, so the containers reach the Postgres this job
      # already has on localhost and a Redis started here for the length of
      # the step.
      - name: The worker image was built, ran an import, and did not skip
        if: matrix.roundtrip && contains(matrix.components, 'data_import')
        working-directory: ${{ runner.temp }}/generated/${{ matrix.slug }}
        env:
          WORKER_IMAGE: koras-worker-image:${{ github.sha }}
          E2E_DATABASE_URL: postgresql+asyncpg://koras_e2e_app:koras_e2e_app@localhost:5432/koras_e2e
          WORKER_IMAGE_REDIS_URL: redis://localhost:6379/0
          WORKER_IMAGE_NETWORK: host
        run: |
          set -euo pipefail
          docker build -f services/worker/Dockerfile -t "$WORKER_IMAGE" .
          docker run -d --name worker-image-redis --network host redis:7-alpine
          trap 'docker rm -f worker-image-redis >/dev/null 2>&1 || true' EXIT
          uv run pytest \
            tests/integration/test_worker_image.py \
            --no-cov -q -rs | tee "$RUNNER_TEMP/worker-image.txt"
          if grep -E -q '[0-9]+ skipped' "$RUNNER_TEMP/worker-image.txt"; then
            echo "::error::a worker image test was skipped; this row built the image and every one of them must run"
            exit 1
          fi
          grep -E -q '[0-9]+ passed' "$RUNNER_TEMP/worker-image.txt"

      # A project generated a moment ago must match what the generator would
      # produce for it. If it does not, either the drift check is wrong or
      # generation is not deterministic, and both are worth failing over —
      # this check is the one that tells an existing project it is behind.
      # Deliberately without ${{ matrix.components }}. A drift check on an
      # existing project reads its component set from its own
      # .koras/project.yaml, so repeating the flags here would test nothing --
      # and an operator a year later will not remember them either.
      - name: Drift check reports nothing
        run: |
          pnpm create-koras-app "${{ matrix.slug }}" \
            --profile "${{ matrix.profile }}" \
            --no-interactive \
            --check-drift --all \
            --output-dir "$RUNNER_TEMP/generated"

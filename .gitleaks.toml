# Secret scanning configuration.
#
# Doppler is the secret authority: nothing real belongs in this repository, so
# the default rule set is used unmodified rather than narrowed. The allowlist
# below covers the values that look like credentials and are not -- test
# fixtures and the local stack, whose whole point is being non-secret.

[extend]
useDefault = true

[[allowlists]]
description = """
Profile templates. These are the files the generator renders into a project,
including its example environment and local stack -- non-secret by construction,
and by the same reasoning as the generated copies they become.
"""
paths = [
  '''profiles/.*/template/local/.*''',
]

[[allowlists]]
description = """
Test fixtures. The redaction and audit suites must contain credential-shaped
strings -- that is what they assert gets scrubbed, and a scanner that forbade
them would forbid testing the defence.

Stated explicitly even though the default rule set already excludes paths that
look like tests. Relying on that would leave the exclusion invisible, and it is
a real blind spot: a genuine credential committed under tests/ is not caught by
this job. A blind spot nobody wrote down is one nobody remembers.
"""
paths = [
  '''tests/.*''',
  '''generators/.*/tests/.*''',
  '''tooling/.*/tests/.*''',
]

[project]
name = "koras-saas-starter"
version = "0.1.0"
description = "KORAS application factory — Python workspace root"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "python-packages/*",
  "services/*",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  # Vendored third-party skills. Their content is upstream's to lint, and
  # reformatting it here would turn every `sync-external-skills.mjs --update`
  # into a conflict. The ESLint config excludes the same tree for the same
  # reason.
  ".claude/skills",
  # Archived evidence from a feature's recorded runs. These are a record of
  # what was executed, not source: they are probe scripts that deliberately
  # assert defective behaviour, so `S101` fires on every line that does the
  # one thing they exist to do. Reformatting them to satisfy a linter would
  # falsify the record, which is the same argument the vendored skills above
  # rest on and the same one `file-references.test.ts` makes about paths in
  # dated passages.
  #
  # Scoped to the runs directories rather than to `docs/`, so a Python file
  # added anywhere else under documentation is still linted. Added 2026-09-21
  # after CI failed on 60 errors in exactly these files -- found by the
  # pipeline because the local check had been `ruff check <paths>` rather
  # than `pnpm lint:py`, which is `ruff check .`.
  "docs/features/*/testing/runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
# ANN101/ANN102 were removed from ruff; listing them does nothing but emit a
# warning on every run. Kept out rather than kept for history.
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101 is bandit's "assert used", which is a real finding in application code
# and nonsense in a test suite -- asserting is what a test does. Scoped to test
# trees rather than disabled globally, so an assert in a service still fails.
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# The CI proof scripts under tests/secure_files drive a generated product from outside it, so
# they shell out to psql, assert with prose messages and hold long diagnostic lines. They are
# linted and type-checked like everything else; only these rules are relaxed, for this
# directory only.
"tests/secure_files/**" = ["E501", "S101", "S603", "S607", "S608", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [
  # Profile templates. Every Python file here exists twice -- once per profile
  # -- and mypy refuses a run where two files map to the same module name, so
  # `mypy .` aborted before checking anything at all rather than checking these
  # twice.
  #
  # Nothing is lost by skipping them: generator-integration.yml generates a real
  # project and runs `uv run mypy python-packages services` inside it, which is
  # the same code with its imports actually resolvable. Checking a template in
  # place is the weaker test of the two.
  "^profiles/",
  # Vendored third-party skills, excluded from ruff and ESLint for the same
  # reason: upstream's code, and linting it makes every upgrade a conflict.
  '^\.claude/skills/',
  # Archived evidence from a feature's recorded runs, excluded from ruff for
  # the reason given there: a record of what was executed, not source. They
  # import a generated product's modules, which do not resolve from here at
  # all, so checking them in place tests nothing and fails for that reason
  # rather than for a real one.
  '^docs/features/[^/]+/testing/runs/',
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "python-packages", "services"]
addopts = "--cov --cov-report=term-missing"

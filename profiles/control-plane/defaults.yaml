schema_version: "1"

# Default answers for the control-plane profile.
# All required components are fixed — no optional prompts for this profile.

applications:
  platform_admin: true
  portal: true

services:
  api: true
  worker: true
  scheduler: true

infrastructure:
  supabase_region: "us-east-1"
  fly_region: "iad"
  vercel_framework: "nextjs"
  terraform_organization: "koras"

output:
  include_example_env: true
  include_docker_compose: true

local:
  ports:
    supabase_db: 54332
    zitadel: 8082
    redis: 6380
    mail_smtp: 1026
    mail_ui: 8026

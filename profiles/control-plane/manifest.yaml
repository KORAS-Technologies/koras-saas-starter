schema_version: "1"
profile: control-plane
version: "1.0.0"

applications:
  platform_admin:
    required: true
    framework: nextjs
    description: "Platform administration UI"
  portal:
    required: true
    framework: nextjs
    description: "Customer account portal"

services:
  api:
    required: true
    framework: fastapi
    description: "Platform REST API"
  worker:
    required: true
    framework: arq
    description: "Background job worker"
  scheduler:
    required: true
    framework: apscheduler
    description: "Cron / task scheduler"

capabilities:
  tenancy: true
  rls: true
  branding: true
  product_registry: true
  organization_registry: true
  tenant_registry: true
  provisioning: true
  reconciliation: true
  subscriptions: true
  entitlements: true
  infrastructure_registry: true
  # Storage *policy*, not object storage. The Control Plane decides which
  # provider handles a customer workload and never holds the objects or the
  # credential -- Doppler holds the credential, and the product does the
  # storing. That is why this profile ships no MinIO in its local stack and no
  # STORAGE_ENDPOINT in its settings, which reads as a contradiction until the
  # capability is named for what it is.
  storage: true
  email: true
  notifications: true
  audit: true
  observability: true

registration:
  registers_as_product: false

infrastructure:
  supabase: true
  zitadel: true
  doppler: true
  vercel:
    applications: ["platform_admin", "portal"]
  fly:
    services: ["api", "worker", "scheduler"]
  cloudflare: true

environments:
  - dev
  - test
  - stg
  - prod

# Maps manifest component keys to template directories. The generator uses this
# to include or exclude template subtrees — profile behaviour stays declarative.
template_map:
  applications:
    platform_admin: apps/admin
    portal: apps/portal
  services:
    api: services/api
    worker: services/worker
    scheduler: services/scheduler
  capabilities: {}

# Directories copied verbatim from the starter into the generated project.
# Terraform modules stay single-sourced here rather than being duplicated
# into each profile template.
shared_assets:
  - source: infrastructure/terraform/modules
    target: infrastructure/terraform/modules

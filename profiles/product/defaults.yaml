schema_version: "1"

# Default answers for interactive prompts when using the product profile.
# All values can be overridden by CLI flags or interactive input.

applications:
  web: true
  admin: true
  marketing: false

services:
  api: true
  worker: true
  scheduler: false
  ai_gateway: false

capabilities:
  billing: true
  custom_domains: true
  # In-app notifications for every product. Nothing external is needed -- the
  # feed is a table and the bell is a component -- so it is on, and
  # `--without notifications` removes the table, the routes, the page and the
  # browser test together. It is refused alongside `--with ai`, because the
  # assistant's approval notice is the one producer the starter ships and a
  # notice with nowhere to land is worse than no notice.
  notifications: true
  # Off until a product has something to import into. The engine is real and
  # tested, and a target names a table the product owns -- so a freshly
  # generated project would carry a page offering nothing. `--with data_import`
  # when the first target exists.
  data_import: false
  white_label: false
  # Off until a product wants an assistant: on, it needs the gateway service
  # and the provider keys a deployed gateway is refused without. Enable both
  # together: --with ai,ai_gateway.
  ai: false
  # Analytics for every product. Nothing external is needed, so it is on;
  # --without reporting removes the router, the pages and the extension
  # point together. It no longer removes the audit table: that is foundation,
  # because a product that records nothing cannot be asked what happened.
  reporting: true
  # The surface over the audit record: search, export, legal holds, the Audit
  # page. On, because a product that records what happened and cannot show it
  # is worse than one that does neither -- and because reading your own history
  # is not a premium feature. `--without audit_governance` removes the routes,
  # the page and the export sweep; the table, its classification and its
  # nightly retention stay, because those are foundation.
  audit_governance: true
  # The three sweeps over stored objects: retention, reconciliation, backup.
  # On, and each sweep is separately off until its own setting asks for it --
  # `STORAGE_LIFECYCLE_ENABLED`, `STORAGE_RECONCILE_ENABLED`,
  # `STORAGE_BACKUP_ENABLED` -- because two of them delete and the third bills
  # a second destination. The capability decides whether the code is there; the
  # settings decide whether it runs.
  storage_governance: true

infrastructure:
  supabase_region: "us-east-1"
  fly_region: "iad"
  vercel_framework: "nextjs"
  terraform_organization: "koras"
  # Where the provisioning credentials live. No Doppler scope is set for
  # generated repositories, so project and config are always explicit.
  doppler_project: "koras-platform-bootstrap"
  doppler_config: "prod"
  # The zone this project's hostnames are issued under. A product is namespaced
  # beneath it -- <slug>.<apex> -- because the apex belongs to the platform and
  # a product that claims a name there takes it from the Control Plane or from
  # the next product. Override per project with --domain when it has its own
  # brand domain. See R-028.
  domain_apex: "korastechnologies.com"

output:
  include_example_env: true
  include_docker_compose: true

local:
  ports:
    supabase_db: 54322
    zitadel: 8080
    redis: 6379
    mail_smtp: 1025
    mail_ui: 8025
    minio_api: 9000
    minio_console: 9001
    # Never 80/443: Windows reserves 80 for http.sys (IIS registers it by
    # default) and binding privileged ports needs root on Linux. Distinct
    # from the control-plane values so both stacks can run side by side.
    proxy_http: 8090
    proxy_https: 8443
    # OTLP collector. Distinct per profile so a product stack and the
    # Control Plane can export telemetry at the same time.
    otlp_grpc: 4317
    otlp_http: 4318
    # Host dev servers. The control-plane profile uses the 3010/8010 block
    # so a product and the Control Plane can run at the same time.
    app_web: 3000
    app_admin: 3001
    app_marketing: 3002
    service_api: 8000
    service_ai_gateway: 4000

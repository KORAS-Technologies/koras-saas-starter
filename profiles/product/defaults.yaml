schema_version: "1"

# Default answers for interactive prompts when using the product profile.
# All values can be overridden by CLI flags or interactive input.

applications:
  web: true
  admin: true
  marketing: false

services:
  api: true
  worker: true
  scheduler: false
  ai_gateway: false

capabilities:
  billing: true
  custom_domains: true
  white_label: false
  # Off until a product wants an assistant: on, it needs the gateway service
  # and the provider keys a deployed gateway is refused without. Enable both
  # together: --with ai,ai_gateway.
  ai: false

infrastructure:
  supabase_region: "us-east-1"
  fly_region: "iad"
  vercel_framework: "nextjs"
  terraform_organization: "koras"
  # Where the provisioning credentials live. No Doppler scope is set for
  # generated repositories, so project and config are always explicit.
  doppler_project: "koras-platform-bootstrap"
  doppler_config: "prod"
  # The zone this project's hostnames are issued under. A product is namespaced
  # beneath it -- <slug>.<apex> -- because the apex belongs to the platform and
  # a product that claims a name there takes it from the Control Plane or from
  # the next product. Override per project with --domain when it has its own
  # brand domain. See R-028.
  domain_apex: "korastechnologies.com"

output:
  include_example_env: true
  include_docker_compose: true

local:
  ports:
    supabase_db: 54322
    zitadel: 8080
    redis: 6379
    mail_smtp: 1025
    mail_ui: 8025
    minio_api: 9000
    minio_console: 9001
    # Never 80/443: Windows reserves 80 for http.sys (IIS registers it by
    # default) and binding privileged ports needs root on Linux. Distinct
    # from the control-plane values so both stacks can run side by side.
    proxy_http: 8090
    proxy_https: 8443
    # OTLP collector. Distinct per profile so a product stack and the
    # Control Plane can export telemetry at the same time.
    otlp_grpc: 4317
    otlp_http: 4318
    # Host dev servers. The control-plane profile uses the 3010/8010 block
    # so a product and the Control Plane can run at the same time.
    app_web: 3000
    app_admin: 3001
    app_marketing: 3002
    service_api: 8000
    service_ai_gateway: 4000

schema_version: "1"
profile: product

applications:
  web:
    required: true
    framework: nextjs
    description: "Customer-facing SaaS UI"
  admin:
    required: false
    framework: nextjs
    description: "Internal operations UI"
  marketing:
    required: false
    framework: nextjs
    description: "Marketing site"

services:
  api:
    required: true
    framework: fastapi
    description: "Primary REST + WebSocket API"
  worker:
    required: false
    framework: arq
    description: "Background job worker"
  scheduler:
    required: false
    framework: apscheduler
    description: "Cron / task scheduler"
  ai_gateway:
    required: false
    framework: litellm
    description: "AI model proxy and routing"

capabilities:
  tenancy: true
  rls: true
  branding: true
  customer_branding: true
  custom_domains: true
  white_label: true
  control_plane_client: true
  billing: true
  storage: true
  email: true
  notifications: true
  feature_flags: true
  audit: true
  observability: true

registration:
  registers_as_product: true
  endpoint: "/api/platform/v1/products"

infrastructure:
  supabase: true
  zitadel: true
  doppler: true
  vercel:
    applications: ["web", "admin", "marketing"]
  fly:
    services: ["api", "worker", "scheduler", "ai_gateway"]
  cloudflare: true

environments:
  - dev
  - test
  - stg
  - prod

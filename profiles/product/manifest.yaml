schema_version: "1"
profile: product
version: "1.0.0"

applications:
  web:
    required: true
    framework: nextjs
    description: "Customer-facing SaaS UI"
  admin:
    required: false
    framework: nextjs
    description: "Internal operations UI"
  marketing:
    required: false
    framework: nextjs
    description: "Marketing site"

services:
  api:
    required: true
    framework: fastapi
    description: "Primary REST + WebSocket API"
  worker:
    required: false
    framework: arq
    description: "Background job worker"
  scheduler:
    required: false
    framework: apscheduler
    description: "Cron / task scheduler"
  ai_gateway:
    required: false
    framework: litellm
    description: "AI model proxy and routing"

capabilities:
  tenancy: true
  rls: true
  branding: true
  customer_branding: true
  custom_domains: true
  white_label: true
  billing: true
  storage: true
  email: true
  notifications: true
  feature_flags: true
  audit: true
  observability: true
  # The AI foundation: the runtime, the assistant's routes and page, the
  # tables and the extension point. Off by default in defaults.yaml, and
  # requires the gateway service below, which is where the provider keys live.
  ai: true
  # Reporting and analytics: the registries, the reports router, the six
  # standard tenant reports, the general audit table, the Analytics pages
  # and the extension point a product registers its own reports in. On by
  # default: it needs no external service.
  reporting: true

registration:
  registers_as_product: true
  endpoint: "/api/platform/v1/products"

infrastructure:
  supabase: true
  zitadel: true
  doppler: true
  vercel:
    applications: ["web", "admin", "marketing"]
  fly:
    services: ["api", "worker", "scheduler", "ai_gateway"]
  cloudflare: true

environments:
  - dev
  - test
  - stg
  - prod

# Maps manifest component keys to template directories. The generator uses this
# to include or exclude template subtrees — profile behaviour stays declarative.
template_map:
  applications:
    web: apps/web
    admin: apps/admin
    marketing: apps/marketing
  services:
    api: services/api
    worker: services/worker
    scheduler: services/scheduler
    ai_gateway: services/ai-gateway
  capabilities:
    billing: packages/billing
    custom_domains: packages/domains
    feature_flags: packages/feature-flags
    # Several paths, because the capability is spread across the tree. What
    # is not listed is generated always and harmless without it: the
    # `koras-ai` package (a framework nothing imports), the permissions the
    # catalogue names, the components in `packages/ui` and the translations.
    ai:
      - services/api/koras_api/core/ai.py
      - services/api/koras_api/core/notify.py
      - services/api/koras_api/core/knowledge.py
      - services/api/koras_api/core/file_indexing.py
      - services/api/koras_api/routers/ai.py
      - services/api/koras_api/routers/platform_ai.py
      - services/api/koras_api/ai
      - supabase/migrations/00006_ai.sql
      - supabase/migrations/00007_ai_usage_cost.sql
      - supabase/migrations/00008_ai_retention.sql
      - supabase/migrations/00009_ai_audit.sql
      - supabase/migrations/00010_ai_knowledge.sql
      - supabase/migrations/00012_ai_overage.sql
      - supabase/tests/060_ai_isolation.sql
      - supabase/tests/070_ai_usage_platform_read.sql
      - supabase/tests/080_ai_retention.sql
      - supabase/tests/090_ai_audit.sql
      - supabase/tests/100_ai_knowledge_isolation.sql
      - tests/unit/test_ai_api.py
      - tests/unit/test_ai_notify.py
      - tests/unit/test_ai_audit.py
      - tests/unit/test_ai_knowledge.py
      - tests/unit/test_platform_ai_usage.py
      - tests/unit/test_ai_retention.py
      - tests/unit/test_ai_file_tools.py
      - tests/unit/test_ai_citations.py
      - tests/unit/test_ai_ocr.py
      - tests/unit/test_ai_gateway_guard.py
      - services/worker/koras_worker/tasks/ai_retention.py
      - apps/web/src/app/dashboard/assistant
      - e2e/assistant.spec.ts
    # Reporting is spread the same way. What is not listed is generated
    # always and harmless without it: the `koras-reporting` package, the
    # permissions the catalogue names, the components in `packages/ui`
    # and the translations.
    reporting:
      - services/api/koras_api/core/reporting.py
      - services/api/koras_api/routers/reporting.py
      - services/api/koras_api/routers/reporting_schedules.py
      - services/api/koras_api/routers/platform_reporting.py
      - services/api/koras_api/reporting
      - services/worker/koras_worker/tasks/reporting.py
      - supabase/migrations/00013_audit_events.sql
      - supabase/migrations/00014_report_schedules.sql
      - supabase/tests/110_audit_isolation.sql
      - supabase/tests/130_report_schedules_isolation.sql
      - tests/unit/test_reporting_api.py
      - tests/unit/test_reporting_standard.py
      - tests/unit/test_reporting_retention.py
      - tests/unit/test_reporting_delivery.py
      - tests/unit/test_reporting_schedules.py
      - tests/unit/test_platform_activity.py
      - tests/unit/reporting_support.py
      - apps/web/src/app/dashboard/analytics
      - apps/web/src/app/api/reports
      - e2e/analytics.spec.ts

# Components that need another enabled beside them. See the generator's
# manifest schema for why this is refused rather than switched on silently.
requires:
  ai: [ai_gateway]

# Directories copied verbatim from the starter into the generated project.
# Terraform modules stay single-sourced here rather than being duplicated
# into each profile template.
shared_assets:
  - source: infrastructure/terraform/modules
    target: infrastructure/terraform/modules
  # The common Claude Code configuration: engineering instructions, the twelve
  # Koras skills, the vendored external skills, the four commands and the four
  # agents. Single-sourced here and copied verbatim, exactly like the Terraform
  # modules, so a skill fixed in the starter is one edit rather than three.
  #
  # The profile overlay is NOT here. Each profile's template carries its own
  # `.claude/skills/koras-profile-<profile>/`, which is how a product never
  # receives control-plane instructions and vice versa.
  - source: .claude
    target: .claude

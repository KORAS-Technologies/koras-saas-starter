schema_version: "1"
profile: product
version: "1.0.0"

applications:
  web:
    required: true
    framework: nextjs
    description: "Customer-facing SaaS UI"
  admin:
    required: false
    framework: nextjs
    description: "Internal operations UI"
  marketing:
    required: false
    framework: nextjs
    description: "Marketing site"

services:
  api:
    required: true
    framework: fastapi
    description: "Primary REST + WebSocket API"
  worker:
    required: false
    framework: arq
    description: "Background job worker"
  scheduler:
    required: false
    framework: apscheduler
    description: "Cron / task scheduler"
  ai_gateway:
    required: false
    framework: litellm
    description: "AI model proxy and routing"
  # A private malware scanner (ClamAV's clamd). Off by default and in no
  # existing product: it is selected with --with clamd. Dev only, no public
  # address, holds no secret -- all declared in its own service.yaml, which is
  # what the deploy workflow and Terraform both read. See docs/CLAMD_SERVICE.md.
  clamd:
    required: false
    framework: clamav
    description: "Private malware scanner (clamd), dev only"

capabilities:
  tenancy: true
  rls: true
  branding: true
  customer_branding: true
  custom_domains: true
  white_label: true
  billing: true
  storage: true
  email: true
  # In-app notifications: the feed, the bell, the drawer, the centre, and the
  # toast and banner primitives beside them. On by default -- a product that
  # cannot tell a person anything is worse than one that can, and unlike
  # importing there is no product for which the answer is plainly no.
  #
  # Declared `true` here since the manifest was written and gating nothing
  # until 2026-09-19: no `template_map` entry, no `defaults.yaml` entry, and a
  # `packages/notifications` that was two lines long. So `--without
  # notifications` removed nothing while appearing to succeed, and the flag
  # recorded in a generated project's `.koras/project.yaml` claimed a feature
  # the project did not have.
  notifications: true
  feature_flags: true
  audit: true
  observability: true
  # The AI foundation: the runtime, the assistant's routes and page, the
  # tables and the extension point. Off by default in defaults.yaml, and
  # requires the gateway service below, which is where the provider keys live.
  ai: true
  # Reporting and analytics: the registries, the reports router, the six
  # standard tenant reports, the Analytics pages and the extension point a
  # product registers its own reports in. On by default: it needs no external
  # service. The general audit table is not here -- it is foundation, and
  # reporting is one of the modules that records to it.
  reporting: true
  # Data import: the engine, the target registry, the run, the dry run and the
  # page. Off by default -- a product with nothing to import should not carry
  # the surface, and unlike notifications there is no product for which the
  # answer is plainly yes.
  data_import: true
  # The surface over the audit record: search, export, legal holds and the
  # Audit page. On by default. The record itself is not here and never will
  # be -- `audit` above is the foundation that writes it, and `audit_events`
  # sat inside the `reporting` gate until 2026-09-16, which meant a product
  # generated without analytics recorded nothing and nobody noticed.
  audit_governance: true
  # The three sweeps over stored objects: retention, reconciliation and
  # backup, with the catalogue the third writes. On by default, and each sweep
  # is separately off until its own setting asks for it, because two of them
  # delete and the third bills a second destination.
  storage_governance: true
  # Trusted file bytes (ADR 0013): the chain by which a stored file is exposed
  # only after it was hashed, scanned and assessed, and released clean-only.
  # Declared `true` like the others and off by default in defaults.yaml, so a
  # product generated without it is byte-identical to before. Enabled, it
  # requires everything the chain stands on (below) and a product that is
  # missing a mandatory setting refuses to start rather than falling back to
  # the legacy release. The artefact map is docs/SECURE_FILES.md.
  secure_files: true

registration:
  registers_as_product: true
  endpoint: "/api/platform/v1/products"

infrastructure:
  supabase: true
  zitadel: true
  doppler: true
  vercel:
    applications: ["web", "admin", "marketing"]
  fly:
    services: ["api", "worker", "scheduler", "ai_gateway", "clamd"]
  cloudflare: true

environments:
  - dev
  - test
  - stg
  - prod

# Maps manifest component keys to template directories. The generator uses this
# to include or exclude template subtrees — profile behaviour stays declarative.
template_map:
  applications:
    web: apps/web
    admin: apps/admin
    marketing: apps/marketing
  services:
    api: services/api
    worker: services/worker
    scheduler: services/scheduler
    ai_gateway: services/ai-gateway
    clamd: services/clamd
  capabilities:
    billing: packages/billing
    custom_domains: packages/domains
    feature_flags: packages/feature-flags
    # Several paths, because the capability is spread across the tree. What
    # is not listed is generated always and harmless without it: the
    # `koras-ai` package (a framework nothing imports), the permissions the
    # catalogue names, the components in `packages/ui` and the translations.
    ai:
      - services/api/koras_api/core/ai.py
      - services/api/koras_api/core/notify.py
      - services/api/koras_api/core/knowledge.py
      - services/api/koras_api/core/file_indexing.py
      - services/api/koras_api/routers/ai.py
      - services/api/koras_api/routers/platform_ai.py
      - services/api/koras_api/ai
      - supabase/migrations/00006_ai.sql
      - supabase/migrations/00007_ai_usage_cost.sql
      - supabase/migrations/00008_ai_retention.sql
      - supabase/migrations/00009_ai_audit.sql
      - supabase/migrations/00010_ai_knowledge.sql
      - supabase/migrations/00012_ai_overage.sql
      - supabase/tests/060_ai_isolation.sql
      - supabase/tests/070_ai_usage_platform_read.sql
      - supabase/tests/080_ai_retention.sql
      - supabase/tests/090_ai_audit.sql
      - supabase/tests/100_ai_knowledge_isolation.sql
      - tests/unit/test_ai_api.py
      - tests/unit/test_ai_notify.py
      - tests/unit/test_ai_audit.py
      - tests/unit/test_ai_knowledge.py
      - tests/unit/test_platform_ai_usage.py
      - tests/unit/test_ai_retention.py
      - tests/unit/test_ai_file_tools.py
      - tests/unit/test_ai_citations.py
      - tests/unit/test_ai_ocr.py
      - tests/unit/test_ai_gateway_guard.py
      - tests/unit/test_ai_turn_quota.py
      - services/worker/koras_worker/tasks/ai_retention.py
      - apps/web/src/app/dashboard/assistant
      - e2e/assistant.spec.ts
    # Data import. The whole of it is gated, including the engine package: an
    # import target names a table the *product* owns, so a product that
    # imports nothing has no use for a parser, a state machine or a run.
    #
    # The migration is gated by the same rule the notification one is: no
    # foundation code and no foundation migration reaches `import_runs`. The
    # only thing outside the gate is the `imports.manage` permission, which is
    # in the catalogue always -- a permission string costs nothing and a
    # catalogue that changed shape with a capability would make the two
    # languages disagree.
    data_import:
      - python-packages/koras-import
      - services/api/koras_api/imports
      - services/api/koras_api/core/imports.py
      - services/api/koras_api/core/import_notify.py
      - services/api/koras_api/routers/imports.py
      - services/worker/koras_worker/tasks/imports.py
      - supabase/migrations/00036_imports.sql
      - supabase/migrations/00038_import_counts.sql
      - supabase/tests/320_imports_isolation.sql
      - tests/unit/test_imports.py
      - tests/unit/test_import_commit.py
      - tests/unit/test_import_templates_api.py
      - tests/unit/test_import_preflight.py
      - tests/unit/test_import_inspection.py
      - tests/unit/test_import_inspection_memory.py
      # GR-352C: what an import may cost the worker it runs in. The slot, the
      # thread, the budget and the cancellation against the product's own
      # task; the kernel's figure for a dry run and a commit; and the commit's
      # all-or-nothing counted against a real database.
      - tests/unit/test_import_worker_envelope.py
      - tests/unit/test_import_worker_memory.py
      - tests/integration/test_import_commit_rls.py
      - tests/integration/test_import_commit_atomic.py
      # GR-352E: the worker's own image, built and run with nothing mounted.
      # A dry run and a commit taken from first line to last inside it, and
      # the probe that is fed to the container. IMPORT-DEF-020 was a module
      # the source tree has and the image did not, and every other suite here
      # runs where the tree is.
      #
      # The gate these jobs share is not listed anywhere, because it is not a
      # capability's: `services/worker/koras_worker/heavy.py` and its two
      # suites are generated with the worker, and a job a product was
      # generated without is skipped inside them.
      - tests/integration/test_worker_image.py
      - tests/integration/worker_image_probe.py
      - apps/web/src/app/dashboard/imports
      # The template download: a route handler, because a download is a body
      # and a server action returns a value. The menu it is reached from is a
      # `packages/ui` primitive and stays outside the gate with the rest of
      # that package.
      - apps/web/src/app/api/imports
      - e2e/imports.spec.ts
      # The round-trip half, which needs a declared target and so skips
      # unless `Generator Integration` installed the fixture. It is in
      # the template rather than the workflow because a product that
      # declares targets of its own should inherit it.
      - e2e/roundtrip/imports.spec.ts
    # Secure files (ADR 0013). Later layers append their files here. The
    # first entry is the operator's page for a product that has the capability;
    # a list cannot be empty, and that page is true only when it is on. What is
    # not listed is generated always and harmless without it: the two
    # `secure_files.py` modules, which carry the generated `SECURE_FILES`
    # constant (False without the capability) and are no-ops when it is False,
    # and `tests/unit/test_secure_files_config.py`, which exercises both modes.
    #
    # Layer 2, the upload foundation: the SHA-256 claim, the incoming key a ticket
    # writes, and the immutable finalization that promotes it to a key only the
    # server writes. What is not listed and differs by mode is *rendered* by the
    # capability rather than gated by it -- `routers/files.py`, `core/errors.py`,
    # the worker's `worker.py` and `Dockerfile`, the web Files and import panels
    # -- and what is not listed and does not differ is shared: `koras-storage`'s
    # signed copy-source guard, `provenance()` and `sha256()` are additions a
    # product without the capability never calls.
    secure_files:
      - docs/SECURE_FILES.md
      - services/api/koras_api/core/upload_window.py
      - services/api/koras_api/core/finalize_jobs.py
      - services/api/koras_api/core/finalize_enqueue.py
      - services/api/koras_api/core/upload_audit.py
      - services/worker/koras_worker/uploads
      - services/worker/koras_worker/tasks/finalize.py
      - supabase/migrations/00039_file_scan_attempts.sql
      - supabase/tests/340_upload_finalization_isolation.sql
      - packages/api-client/src/upload-claim.ts
      - packages/api-client/src/upload-claim.test.ts
      - apps/web/src/lib/browser-upload.ts
      - tests/unit/upload_store_support.py
      - tests/unit/test_upload_finalization.py
      - tests/unit/test_upload_finalize_task.py
      - tests/integration/test_upload_finalization_real.py
      - tests/integration/test_upload_checksum_provenance_real.py
      - tests/integration/test_upload_finalization_provider.py
      - tests/integration/test_upload_checksum_provider.py
      # Layer 3, the scanner: the clamd client, the bounded object reader, the structural and
      # integrity gates, the release assessment and the guarded transitions out of `pending`
      # (`scanning/`), the `file.scan` job and the reconciliation sweep, the API-side
      # declaration and enqueue the worker image carries, the audit actions, the two
      # migrations (the thirteenth failure word and the sweep's due-time indexes) and their
      # row-level-security suites. `finalize.py` (listed above) hands a finalized file to
      # `file.scan`; `worker.py` and `Dockerfile` are rendered by the capability.
      - services/worker/koras_worker/scanning
      - services/worker/koras_worker/tasks/scan.py
      - services/worker/koras_worker/tasks/scan_sweep.py
      - services/api/koras_api/core/scan_jobs.py
      - services/api/koras_api/core/scan_enqueue.py
      - services/api/koras_api/core/scan_audit.py
      - supabase/migrations/00040_file_scan_interrupted.sql
      - supabase/migrations/00041_file_scan_due_indexes.sql
      - supabase/tests/350_file_scan_columns_isolation.sql
      - supabase/tests/351_file_scan_sweep_selection.sql
      - tests/unit/eicar_support.py
      - tests/unit/object_support.py
      - tests/unit/scan_transition_support.py
      - tests/unit/scanner_support.py
      - tests/unit/zip_support.py
      - tests/unit/test_file_scan_fixtures.py
      - tests/unit/test_scan_enqueue.py
      - tests/unit/test_scan_handoff.py
      - tests/unit/test_scan_interrupted.py
      - tests/unit/test_scan_runtime.py
      - tests/unit/test_scan_sweep.py
      - tests/unit/test_scan_sweep_fairness.py
      - tests/unit/test_scan_task.py
      - tests/unit/test_scanner_foundation.py
      - tests/unit/test_scanner_object_reader.py
      - tests/unit/test_scanner_structural_gate.py
      - tests/unit/test_scanner_transition.py
      - tests/integration/test_scan_runtime_real.py
      - tests/integration/test_scan_sweep_real.py
      - tests/integration/test_scan_transition_real.py
      - tests/integration/test_scan_orchestration_real.py
      - tests/integration/test_scanner_clamd_live.py
      - tests/integration/test_worker_image_scanner.py
      # Layer 4, the release layer: the canonical clean-only predicate is `core/file_release.py`,
      # which is generated always (it dispatches on `SECURE_FILES`), so it is not listed. What is
      # listed is what only the capability has: the HTTP gate and the audit action it records, the
      # derived-content withdrawal (migration and its row-level-security suite) and the tests. What
      # is *rendered* by the capability rather than gated by it: `routers/files.py`, `core/file_hooks.py`,
      # `core/file_indexing.py`, `core/ai.py`, `core/knowledge.py`, `core/imports.py`, `ai/tools.py`,
      # the worker's `Dockerfile` and the web Files panel.
      - services/api/koras_api/core/file_release_gate.py
      - services/api/koras_api/core/release_audit.py
      - supabase/migrations/00042_file_derived_content_withdrawal.sql
      - supabase/tests/360_file_derived_content_withdrawal.sql
      - tests/unit/test_files_lazy_indexing_api.py
      - tests/unit/test_ai_indexing_gate.py
      - tests/unit/test_derived_content_withdrawal_static.py
      - tests/integration/test_file_release_real.py
      - tests/integration/test_file_derived_content_real.py
      - tests/integration/test_release_orchestration_real.py
      # The Files page's reading of what the server released, and the browser round trip over it.
      - packages/api-client/src/file-state.ts
      - packages/api-client/src/file-state.test.ts
      - e2e/roundtrip/files-release-state.spec.ts

    # In-app notifications: the table, the emitter, the routes, the page and
    # the browser test.
    #
    # **The migration *is* gated**, and by the manifest's own rule it may be:
    # no foundation code and no foundation migration reaches `notifications`.
    # Every producer is inside a capability -- the approval notice is `ai`'s --
    # so a product generated without this has nothing that would write a row.
    # That is the test `audit_events` failed until 2026-09-16, applied forward
    # rather than remembered.
    #
    # What is not listed is generated always and harmless without it: the
    # components in `packages/ui`, the permissions catalogue (there is no
    # notification permission -- a feed is guarded by the policy keyed to the
    # subject, not by a string) and the translations.
    notifications:
      - services/api/koras_api/core/notifications.py
      - services/api/koras_api/routers/notifications.py
      - services/worker/koras_worker/tasks/notifications.py
      - supabase/migrations/00032_notifications.sql
      - supabase/migrations/00037_notification_outbox.sql
      - services/api/koras_api/core/outbox.py
      - services/worker/koras_worker/tasks/outbox.py
      - supabase/tests/300_notification_outbox_isolation.sql
      - tests/unit/test_outbox.py
      - supabase/tests/290_notifications_isolation.sql
      - tests/unit/test_notifications.py
      - apps/web/src/app/dashboard/notifications
      - e2e/notifications.spec.ts
    # Reporting is spread the same way. What is not listed is generated
    # always and harmless without it: the `koras-reporting` package, the
    # permissions the catalogue names, the components in `packages/ui`
    # and the translations.
    reporting:
      - services/api/koras_api/core/reporting.py
      - services/api/koras_api/routers/reporting.py
      - services/api/koras_api/routers/reporting_schedules.py
      - services/api/koras_api/routers/platform_reporting.py
      - services/api/koras_api/reporting
      - services/worker/koras_worker/tasks/reporting.py
      - supabase/migrations/00014_report_schedules.sql
      - supabase/migrations/00016_report_schedule_locale.sql
      - supabase/tests/130_report_schedules_isolation.sql
      - tests/unit/test_reporting_api.py
      - tests/unit/test_reporting_standard.py
      - tests/unit/test_reporting_retention.py
      - tests/unit/test_reporting_delivery.py
      # GR-352E: a scheduled delivery carries as many rows as an export does.
      - tests/unit/test_reporting_delivery_bound.py
      - tests/unit/test_reporting_schedules.py
      - tests/unit/test_platform_activity.py
      - tests/unit/reporting_support.py
      - apps/web/src/app/dashboard/analytics
      - apps/web/src/app/api/reports
      - e2e/analytics.spec.ts
    # Audit governance: the surface over the audit record, not the record.
    #
    # **Every migration stays out of this list, and that is the whole design.**
    # `audit_events` sat inside the `reporting` gate until 2026-09-16, which
    # meant a product generated without analytics recorded nothing at all and
    # nobody noticed, because the absence looks exactly like an empty table.
    # The rule this list follows instead: a table is gated only when no
    # foundation code and no foundation migration reaches it. `audit_exports`
    # fails that test twice over -- `platform_governance.py` counts it and
    # `00024`'s `claimed_storage_keys` reads it -- and `legal_holds` fails it
    # three times, because the object sweep, the audit sweep and
    # `DELETE /files/{id}` all ask `under_legal_hold`.
    #
    # So what a product loses without this is the reading and the managing:
    # search, export, the holds routes, the Audit page, and the sweep that
    # retires an expired export. What it keeps is the record itself, its
    # classification, its retention, and every table.
    audit_governance:
      - services/api/koras_api/core/audit_export.py
      - services/api/koras_api/core/holds.py
      - services/api/koras_api/routers/audit.py
      - services/api/koras_api/routers/audit_exports.py
      - services/api/koras_api/routers/holds.py
      - services/worker/koras_worker/tasks/governance_expiry.py
      - tests/unit/test_governance_review.py
      - tests/unit/test_legal_holds.py
      - apps/web/src/app/dashboard/audit
      - apps/web/src/app/dashboard/governance
      - e2e/audit.spec.ts
      - e2e/governance.spec.ts
    # Storage governance: the three sweeps over stored objects, and the
    # catalogue one of them writes.
    #
    # `00025_file_backups.sql` *is* gated, and it is the only governance
    # migration that is: nothing in the foundation reads `file_backups`, and
    # nothing but `storage_backup.py` writes it. The columns the sweeps act on
    # -- `retain_until`, `legal_hold`, `backup_status` -- live on `files` from
    # `00018`, which is foundation, so a product without this capability has an
    # index that records state nothing acts on. That is the honest shape: the
    # column says what is true, and no sweep is pretending to maintain it.
    storage_governance:
      - services/api/koras_api/core/restore.py
      - services/api/koras_api/routers/restore.py
      - services/worker/koras_worker/tasks/storage_backup.py
      - services/worker/koras_worker/tasks/storage_lifecycle.py
      - services/worker/koras_worker/tasks/storage_reconcile.py
      - services/worker/koras_worker/tasks/storage_restore.py
      - apps/web/src/app/dashboard/restore
      - e2e/restore.spec.ts
      - supabase/migrations/00025_file_backups.sql
      - supabase/migrations/00026_restore_requests.sql
      - supabase/tests/240_file_backups_isolation.sql
      - supabase/tests/250_restore_isolation.sql
      - tests/unit/test_governance_sweeps_review.py
      - tests/unit/test_storage_backup.py
      - tests/unit/test_storage_restore.py
      - tests/unit/test_storage_lifecycle.py
      - tests/unit/test_storage_reconcile.py

# Components that need another enabled beside them. See the generator's
# manifest schema for why this is refused rather than switched on silently.
requires:
  ai: [ai_gateway, notifications]
  # The commit tells whoever started and whoever confirmed the run that it is
  # over, through the same dispatch point the assistant uses. Refused rather
  # than degraded: a commit is minutes of work in a worker and the person who
  # confirmed it has closed the page, so an import framework whose completion
  # notice silently does nothing is one whose runs appear to hang.
  data_import: [notifications]
  # The chain stands on object storage (storage), on rows scoped per tenant
  # (tenancy, rls), and on a worker that finalizes and scans and a scanner to
  # scan with (worker, clamd). Refused rather than implied: clamd is a Fly app
  # and a set of secrets the operator has to decide to have.
  secure_files: [storage, tenancy, rls, worker, clamd]

# Directories copied verbatim from the starter into the generated project.
# Terraform modules stay single-sourced here rather than being duplicated
# into each profile template.
shared_assets:
  - source: infrastructure/terraform/modules
    target: infrastructure/terraform/modules
  # The common Claude Code configuration: engineering instructions, the twelve
  # Koras skills, the vendored external skills, the four commands and the four
  # agents. Single-sourced here and copied verbatim, exactly like the Terraform
  # modules, so a skill fixed in the starter is one edit rather than three.
  #
  # The profile overlay is NOT here. Each profile's template carries its own
  # `.claude/skills/koras-profile-<profile>/`, which is how a product never
  # receives control-plane instructions and vice versa.
  #
  # Neither is the multi-agent engineering framework — the 40-agent registry,
  # the orchestration contract, the domain framework and the feature
  # documentation templates. Those are product-only, and this mechanism copies
  # unconditionally into both profiles, so placing them here would hand the
  # Control Plane a customer-product orchestration contract. They live in
  # `profiles/product/template/.claude/` instead, and
  # `tests/orchestration.test.ts` asserts both that a product receives them and
  # that the Control Plane does not.
  - source: .claude
    target: .claude
  # The Postman tooling: a generic extractor (imports the real FastAPI app
  # and calls its own .openapi(), touching neither database nor network), a
  # schema-to-collection converter, and the CI-Smoke/Security-negative-test
  # templates for this profile. Copied verbatim rather than rendered, like the
  # Terraform modules -- the scripts take no profile-specific values, they
  # discover them (routes, tags, schemas) from the service they are pointed
  # at. See docs/api/postman-standard.md.
  - source: tooling/postman
    target: tooling/postman

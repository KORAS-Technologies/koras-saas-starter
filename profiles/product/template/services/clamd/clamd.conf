# clamd configuration for the KORAS scanner service.
#
# Replaces the image's own clamd.conf wholesale rather than patching it with
# CLAMD_CONF_* variables: the limits below are a contract, and a contract that
# is a list of sed edits applied at boot cannot be read, diffed or tested.
#
# Every limit is derived from one number -- the supported input ceiling of
# 100 MiB -- and the derivation is in docs/CLAMD_SERVICE.md. Change the ceiling
# there first; the tests recompute these from it.

Foreground yes
# No LogFile: in the foreground clamd writes to stderr, which is what Fly
# collects. The image's own path under /var/log is not writable by the
# unprivileged user this container runs as.
LogTime yes
LogVerbose no

User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

# TCP only, on two address families, because two different clients connect:
#   ::       Fly's private network (6PN) is IPv6. Product services reach the
#            scanner at <app>.internal over it.
#   0.0.0.0  Fly's machine check (checks.clamd_tcp in fly.toml) is run by the
#            host and connects to the machine's internal IPv4 address on eth0
#            (172.19.x.x). It is not loopback and it is not 6PN, so neither
#            127.0.0.1 nor :: alone satisfies it. clamd sets IPV6_V6ONLY, so
#            `::` does not cover IPv4 and both lines are needed.
# Neither is a public address: with no [[services]] block Fly routes nothing
# from the internet here, and eth0's IPv4 is the machine's private one.
# There is no Unix socket: nothing else runs in this container.
TCPSocket 3310
TCPAddr 0.0.0.0
TCPAddr ::

# ---- Input ceiling: 100 MiB -------------------------------------------------
# Exactly the ceiling, enforced on the stream itself. The product refuses
# anything larger before it asks, so a larger stream reaching here is a bug in
# the caller and is refused (INSTREAM size limit exceeded) rather than scanned.
StreamMaxLength 100M

# ---- Expansion bounds -------------------------------------------------------
# MaxScanSize: total bytes examined for one scan, counting everything unpacked.
# Five times the ceiling: an ordinary DOCX or XLSX expands a few times over,
# and a ceiling-sized archive of already-compressed media does not expand at
# all. Anything that needs more is not scanned and is reported
# (AlertExceedsMax), which the caller must treat as not clean.
MaxScanSize 500M
# MaxFileSize: the largest single object, including one unpacked from an
# archive. EQUAL to MaxScanSize, and that is not tidiness. Measured on ClamAV
# 1.4.6 and 1.5.4: a ZIP entry larger than MaxFileSize is skipped WITHOUT an
# alert, so with MaxFileSize at the 100 MiB ceiling a marker 120 MiB into an
# entry was never found and the archive scanned clean. At MaxFileSize equal to
# MaxScanSize an oversized entry exceeds MaxScanSize instead, which does alert,
# and a marker 450 MiB deep is found. The input ceiling above is what stops a
# large file arriving; this only governs what is inside one.
MaxFileSize 500M
# Archive nesting. An Office document inside a mail attachment inside an
# archive is four deep; 8 is double that and a fraction of the default 17.
MaxRecursion 8
# Files unpacked from one input. Ordinary Office documents have hundreds of
# parts; the default 10000 admits a flood of tiny ones.
MaxFiles 5000
# Wall-clock milliseconds for one scan. See docs/CLAMD_SERVICE.md for the
# measurement this was set against.
MaxScanTime 120000

# ---- Incomplete inspection is never clean -----------------------------------
# A limit hit is reported as a detection (Heuristics.Limits.Exceeded) instead of
# skipped silently, and so is anything that cannot be opened because it is
# encrypted. Without these two, "could not look" and "looked, nothing there"
# produce the same answer, and only one of them is safe.
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes

ScanArchive yes
ScanOLE2 yes
ScanPDF yes
ScanXMLDOCS yes
ScanHTML yes
ScanMail yes

# ---- Resources: shared-cpu-2x, 2 GiB ----------------------------------------
MaxThreads 2
MaxQueue 20
MaxConnectionQueueLength 15
# A reload briefly holds two copies of the signature database. Disabled,
# because that doubling is what takes 2 GiB over; scans wait during a reload
# instead of the process being killed.
ConcurrentDatabaseReload no
# Exit rather than limp when memory runs out, so the machine restarts clean.
ExitOnOOM yes

# Idle and slow clients are dropped. A scan request that stops arriving must
# not hold one of the two threads.
CommandReadTimeout 30
IdleTimeout 30
ReadTimeout 120
SendBufTimeout 500

# Notice a database freshclam replaced, without a control socket.
SelfCheck 600

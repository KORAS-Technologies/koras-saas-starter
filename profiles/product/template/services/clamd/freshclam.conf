# freshclam configuration. Signature updates only; nothing here touches limits.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Per day. The default, and well inside what the CDN tolerates.
Checks 12
# No NotifyClamd: clamd's SelfCheck notices replaced databases itself.
Foreground yes

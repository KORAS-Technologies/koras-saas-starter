# LiteLLM proxy configuration.
#
# The gateway is an OpenAI-compatible proxy in front of the model providers, so
# a product calls it with any OpenAI SDK pointed at AI_GATEWAY_URL and
# authenticated with LITELLM_MASTER_KEY. Which providers it can reach is this
# file; the keys come from the environment (Doppler in a deployed estate,
# .env.local locally) and never live here.
#
# To add a model, add an entry to `model_list`: `model_name` is what a caller
# asks for, `litellm_params.model` is the provider route, and `api_key` names
# the environment variable that holds the credential. Declare that variable in
# `local/config/secrets.manifest` so a deployed gateway is required to have it.
#
# The names below are what `services/api/koras_api/ai/models.py` routes the
# product's model aliases to. Rename one here and the catalogue there in the
# same change; the starter's structural test keeps the two level.
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Google Gemini and OpenRouter are optional providers: their keys are
  # declared optional in the secrets manifest, and a route to one of them
  # answers with the provider's authentication error when the key is unset,
  # which the runtime treats as "try the next route". A customer whose
  # policy names only an unkeyed provider gets that error, not another
  # provider's answer.
  - model_name: gemini-3-5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-embedding
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY

  # OpenRouter is one key in front of many models; the two below are the
  # open-weight choices the platform's catalogue offers under it.
  - model_name: openrouter-llama-3.3-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  # Every call presents this key; without it the proxy is open to anyone who
  # can reach it. The product holds the same value and sends it as the bearer.
  master_key: os.environ/LITELLM_MASTER_KEY
  # No `database_url` on purpose. It turns on LiteLLM's own key-management and
  # spend-tracking tables, which need a Postgres of their own and a Prisma
  # migration nothing in the estate runs -- so setting it makes the proxy fail
  # to boot rather than adding a feature. Re-add it, with a provisioned and
  # migrated database, only when virtual keys or spend limits are wanted.

litellm_settings:
  telemetry: false
  # No `success_callback` here. It listed "langfuse", which is neither a
  # dependency of this service nor given any LANGFUSE_* credentials, so the
  # first request failed loading the callback. Add langfuse (the dependency,
  # the three LANGFUSE_* secrets, and the callback) as one deliberate change
  # when request tracing is wanted.

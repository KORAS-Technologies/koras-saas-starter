schema_version: 1

# EXAMPLE ONLY. Nothing reads this file.
#
# Copy it to `.claude/domain/domain-registry.yaml` and edit it for the product.
# Every path below is product-created and does not ship with the starter; the
# starter provides `DOMAIN-AGENT-TEMPLATE.md` to copy from. See README.md.

product: example-product

# The domain directory this registry describes. One directory per domain,
# named for the domain: docoris, legal, insurance, and so on.
primary_domain: example-domain

agents:
  - id: example-domain-expert
    # Product-created: copy DOMAIN-AGENT-TEMPLATE.md to this path.
    definition: .claude/domain/example-domain/domain-expert.md
    role: primary
    activate_for: [planning, domain_feature, domain_review]

  # A product may add specialists alongside the primary expert.
  # - id: example-billing-rules-expert
  #   definition: .claude/domain/example-domain/billing-rules-expert.md
  #   role: specialist
  #   activate_for: [domain_feature, domain_review]

# Authoritative sources the domain agents cite. Product-created.
knowledge:
  - .claude/domain/example-domain/knowledge/
  - docs/domain/
  - docs/requirements/

# When the domain review gate applies. Without this registry, the gate simply
# does not apply and the Orchestrator skips it.
domain_review:
  required_for:
    - features_touching_core_domain_workflows
    - features_changing_business_rules_or_calculations
    - features_changing_domain_terminology_visible_to_customers
  contract: .claude/domain/DOMAIN-REVIEW-CONTRACT.md

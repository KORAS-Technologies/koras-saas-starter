schema_version: 1

# The canonical feature documentation structure for a KORAS product.
#
# This file is authoritative. Where an agent definition, a command, a template
# or an example disagrees with it, this file wins and the other is the defect.
# The V2 package shipped two incompatible layouts -- a flat one here and a
# numbered-directory one in the usage examples -- which is how QA evidence ends
# up in two places and the evidence reviewer cannot find it.

documentation:
  root_pattern: docs/features/<feature-id>-<slug>

  # Six sections, named rather than numbered. Numbering encodes an order that
  # the work does not actually follow: security review and documentation both
  # run more than once, and a numbered prefix makes every such directory look
  # out of sequence.
  sections:
    requirements: requirements/
    design: design/
    testing: testing/
    security: security/
    documentation: documentation/
    release: release/

  required_for_all_features:
    - requirements/user-story.md
    - design/technical-design.md
    - testing/test-plan.md
    - release/release-notes.md

  # condition id -> the documents that condition requires. Keys come from
  # `conditions.yaml` and nowhere else.
  #
  # This replaced a field called `required_for_user_facing_features`, which
  # carried an applicability token inside a field name where nothing could
  # check it -- and where it disagreed with both of the other two spellings of
  # the same question. A condition named in a key is a condition a test can
  # resolve; a condition named in a field name is a comment.
  required_by_condition:
    user_interface:
      - design/ux-design.md
      - testing/manual/manual-test-guide.md
      - testing/manual/manual-test-results.md
      - testing/manual/screenshots/
      - documentation/user-guide.md
    business_workflow:
      - design/functional-design.md
    operational_configuration:
      - documentation/admin-guide.md
    security_boundary:
      - security/threat-model.md
      - security/security-review.md
    sensitive_or_regulated_data:
      - security/threat-model.md
      - security/security-review.md
    cross_feature_or_release:
      - testing/regression-results.md
    automated_verification_executed:
      - testing/automated-test-results.md

  # WHEN each kind of document is written.
  #
  # V2 said what to write and never when, and the order it produced was the
  # expensive one: narrative documents written alongside the code, then
  # rewritten every time the code moved, each rewrite pulling an audit and an
  # acceptance behind it. Planning documents genuinely must come first; a
  # user guide genuinely cannot be right until the thing it describes has
  # stopped changing.
  timing:
    before_implementation:
      - requirements/user-story.md
      - design/technical-design.md
      - design/functional-design.md
      - design/ux-design.md
      - security/threat-model.md
      - testing/test-plan.md
    during_implementation:
      # Appended as things happen. Never rewritten to look tidier later.
      - testing/runs/
    after_the_code_settles:
      # Written once, after code freeze. Writing these earlier does not save
      # time; it spends it twice.
      - documentation/user-guide.md
      - documentation/admin-guide.md
      - security/security-review.md
      - release/release-notes.md
    audited_once:
      # One consistency audit, after the quality freeze. See the
      # documentation_audit gate.
      - the whole feature directory

  # Raw evidence is APPENDED, never revised.
  #
  # A summary that is edited until it matches the latest run has destroyed
  # the only thing evidence is for: the ability to check later what actually
  # happened. A run that failed is a historical fact, and a directory of runs
  # where every one passed is not a record, it is a claim.
  evidence_runs:
    path: testing/runs/<run-id>/
    run_id: <YYYY-MM-DD>-<nn>
    each_run_records:
      - the command, verbatim
      - the commit under test
      - the result
      - the timestamp
      - the environment, for anything that touched a running system
      - the output or artefacts
    rules:
      - A run directory is written once and never edited afterwards.
      - A failed run stays. Deleting it removes the evidence that a defect existed.
      - A summary document points at the latest valid run; it does not absorb or replace it.
      - Re-running something produces a new run directory, not an updated one.

  # THE ONE ARTEFACT THAT ACTUALLY PROVES THE CHANGE.
  #
  # A feature produces a lot of evidence and most of it is corroborating: the
  # suite still passes, the page still renders, the reviewer found nothing.
  # Usually exactly one artefact is the proof -- the before-and-after that
  # shows the reported defect happening and then not happening. For GR-250 it
  # was a browser console with the warning in it, and then the same console
  # without it, and the framework required none of that: not that it be
  # captured, not that it be kept, and not that anybody but the author look
  # at it. The strongest proof in the lifecycle was the least governed thing
  # in it.
  #
  # So it is declared. One block, per feature, naming what will prove the
  # change before the thing that proves it is run.
  primary_evidence:
    # Declared in the execution plan, BEFORE the validating action. Not
    # after: evidence chosen once the result is known is a result with a
    # label on it. Declaring it first is what makes the prediction falsifiable
    # -- the author has to say what they expect to see while they can still
    # be wrong about it.
    declared: before the validating action, in the execution plan
    required_when: the change is made in response to an observed defect, or its correctness is not visible in an automated result
    fields:
      - type                    # from `types` below
      - producer                # the agent or person who captures it
      - raw_evidence_location   # a path under evidence_runs, written once
      - independent_verifier    # an agent that did not produce it
      - claim_proved            # what this evidence establishes
      - claim_not_proved        # what it does not, and what would be needed
    types:
      - test_output             # a suite, a case, a command and its result
      - console_capture         # what a browser or a process actually printed
      - log                     # a service log over the window that matters
      - api_response            # the response itself, headers and status included
      - screenshot              # a rendered state, where rendering is the claim
      - generated_artifact      # a produced file, migration or build output
      - other                   # anything else, described explicitly rather than left blank
    # Raw capture goes in a run directory under `evidence_runs` above and
    # obeys its rules: written once, never revised, a failed run retained.
    # This block points at that policy rather than restating it -- a second
    # retention rule is how the two come to disagree about whether a run may
    # be edited.
    retained_under: evidence_runs
    # INDEPENDENT VERIFICATION IS NOT RE-EXECUTION. The verifier's question is
    # "does this artefact support the claim made about it", and reading a
    # retained capture answers that. Re-running the scenario answers a
    # different and sometimes impossible question -- a race, a first-load
    # warning or a one-off migration may not be reproducible on demand, and
    # requiring reproduction would mean the least reproducible defects get
    # the weakest evidence.
    independent_verification:
      required: true
      # The one thing it may not be. Everything else is a matter of what the
      # claim needs.
      verifier_is_not_the_producer: true
      satisfied_by:
        - reviewing the retained raw capture against the claim
        - re-running the scenario, where that is cheap and deterministic
        - an independent observation of the same behaviour by other means
      in_FAST: >-
        Reviewing the retained capture is sufficient. FAST does not staff a
        second execution of the scenario, and demanding one would make the
        contract something a FAST change quietly skips instead of something
        it does.
    # BOTH HALVES, ALWAYS. A console with no warning in it proves the warning
    # is not printed on that path, in that browser, on that load. It does not
    # prove the component hydrates correctly, and a record that says only the
    # first thing invites the second to be assumed. The field is not optional
    # and "nothing" is not an answer to it.
    both_claims_required: true
    never:
      - Declaring the evidence after the result is known.
      - A primary evidence block whose verifier is its producer.
      - "`claim_not_proved` left empty because nothing came to mind."
      - Summarising a capture in place of retaining it. The summary is not the evidence.
      - Treating the absence of an error as proof of a behaviour nobody observed.
    # Deliberately NOT made universal. This does not require a screenshot, a
    # manual pass, a browser run or an evidence audit for every change --
    # those are decided by `manual_qa` below and by the conditions in
    # quality-gates.yaml, and turning one declaration into four mandatory
    # gates is exactly the over-activation the framework was rewritten to
    # stop. A change whose correctness the automated suite already shows
    # declares that suite's output as its primary evidence, and that is the
    # whole of the obligation.
    proportionality: One block per feature, naming one artefact. Not a new gate.

  # WHEN a manual pass is required, rather than for everything.
  #
  # Manual QA is not being reduced here; it is being aimed. A backend-only
  # change with no surface a person can reach has nothing for a person to
  # look at, and requiring a pass anyway produces the worst possible
  # artefact: a document full of passes nobody really executed.
  manual_qa:
    # The gates this clause governs. `quality-gates.yaml` decides whether each
    # of them CONCERNS a change; this decides whether a PERSON has to satisfy
    # it. Both halves are needed and they are different questions, so each
    # file names the other rather than answering both.
    #
    # Named explicitly because the first real FAST run found the gap: a
    # two-line CSS fix, fully covered by four existing browser assertions,
    # selected a manual pass, a screenshot pack and an evidence audit, and
    # nothing said which file decided. 2026-09-20.
    governs_gates:
      - manual_qa_pass
      - screenshot_evidence_complete
      - qa_evidence_audit
    required_when:
      - the change alters something a person sees, reads or operates
      - the change alters a sequence a person completes
      - correctness depends on what the browser actually does, not on what the server returned
      - a permission or tenant boundary is visible in the interface
    not_required_when:
      - the change has no surface a person can reach
      - automated verification observes exactly what a person would, at the same level
    # When a clause above holds, the three gates are NOT_APPLICABLE with the
    # clause named -- never PASS, and never BLOCKED. BLOCKED would say a
    # person was needed and unavailable, which is a different and worse fact
    # than a person not being needed.
    when_not_required_record: NOT_APPLICABLE, naming the clause
    # The exemption is about who observes, never about how much time there is.
    never_exempted_because:
      - the change is small
      - the schedule is tight
      - a person is unavailable
    never:
      - A pass recorded for a case that was not executed.
      - A pass inferred from an automated result. An automated result is different evidence.
      - Reducing manual QA because the schedule is tight. That is an escalation, not a decision.
    blocked_is_an_answer: >-
      BLOCKED, with the reason, is the correct outcome when execution is
      impossible. It is never counted as a pass, and it is never a failure of
      the feature.
    # WHEN a required pass happens is a third question, answered by neither
    # clause above. `governs_gates` names manual_qa_pass, screenshot_evidence_
    # complete and qa_evidence_audit, and all three are `deferrable_in_build`
    # in quality-gates.yaml -- so a BUILD-disposition feature that required
    # them still requires them, just not yet. acceptance-batching.yaml owns
    # that timing decision; this file still owns whether a person is needed
    # at all, and neither clause above is softened by the other existing.
    timing_owned_by: .claude/orchestration/acceptance-batching.yaml

  # WHICH screenshots are worth keeping.
  #
  # One real feature produced roughly 164 screenshots for about 20 manual
  # cases -- eight per case, most of them a click on the way to somewhere.
  # The cost is not storage. It is that a reviewer cannot tell which images
  # prove anything, so the evidence gets skimmed, and skimmed evidence is the
  # same as no evidence with more effort spent.
  #
  # There is no maximum. A capture earns its place by proving something a
  # sentence could not, and a high-risk workflow that needs a dozen should
  # have a dozen.
  screenshots:
    capture_when_it_proves:
      - a starting state a later image is meaningless without
      - the transition the case exists to demonstrate
      - a validation or error state, showing the actual message
      - the final result the expected outcome describes
      - a permission or tenant boundary behaving as specified
      - an accessibility condition that is visual - focus, contrast, a visible state
    do_not_capture:
      - navigation on the way to the thing being tested
      - a click whose only outcome is the next screen
      - the same state twice because a later step happened to pass through it
      - anything a step's written actual result already establishes
    no_maximum: true
    higher_risk_may_justify_more: true
    # The field that makes the policy self-enforcing. A capture whose purpose
    # cannot be written in a phrase is a capture that proves nothing, and
    # writing that phrase is how the author notices.
    purpose_required_when_not_obvious: true

  # One path shape for evidence, so `qa-reviewer` can check it mechanically.
  #   testing/manual/screenshots/<test-case-id>/step-01-<description>.png
  screenshot_path: testing/manual/screenshots/<test-case-id>/
  screenshot_naming: step-<nn>-<description>.png

  templates:
    root: .claude/templates/feature
    map:
      requirements/user-story.md: user-story.md
      design/technical-design.md: technical-design.md
      design/functional-design.md: functional-design.md
      design/ux-design.md: ux-design.md
      testing/test-plan.md: test-plan.md
      testing/automated-test-results.md: automated-test-results.md
      testing/regression-results.md: regression-results.md
      testing/manual/manual-test-guide.md: manual-test-guide.md
      testing/manual/manual-test-results.md: manual-test-results.md
      security/threat-model.md: threat-model.md
      security/security-review.md: security-review.md
      documentation/user-guide.md: user-guide.md
      documentation/admin-guide.md: admin-guide.md
      release/release-notes.md: release-notes.md

  # Every manual test case carries all of these. `test-documentation` writes
  # them; `qa-reviewer` checks that none is missing.
  test_case_fields:
    - test_case_id
    - objective
    - priority
    - preconditions
    - test_data
    - numbered_steps
    - expected_result
    - actual_result
    - verdict          # PASS | FAIL | BLOCKED, and nothing else
    - evidence_reference
    # What each capture proves, where that is not obvious from the step. The
    # field exists to make the screenshot policy self-enforcing: a capture
    # whose purpose cannot be written in a phrase is one that proves nothing,
    # and writing the phrase is how the author finds that out.
    - evidence_purpose

  evidence_rules:
    actual_execution_only: true
    no_fabricated_screenshots: true
    screenshots_from_executed_steps_only: true
    expected_and_actual_required: true
    verdicts: [PASS, FAIL, BLOCKED]
    blocked_requires_documented_reason: true
    commit_and_environment_required: true
    tester_and_run_date_required: true
    automated_results_do_not_satisfy_manual_gate: true
    raw_runs_are_append_only: true
    historical_failed_runs_are_retained: true

schema_version: 1

# How much machinery a change gets.
#
# A mode is a ROUTING STRATEGY, not a quota. It does not name a number of
# agents and no test asserts one, because agent count is not a measure of
# anything: a one-line copy fix reviewed by six agents and a tenancy change
# reviewed by six agents are not equally well reviewed.
#
# What a mode actually changes is narrow, deliberately:
#
#   1. the always-considered agent set -- the planning depth a change gets
#      before anybody writes code;
#   2. whether gate results may be reused across a product-code change
#      (see gate-invalidation.yaml);
#
# What a mode does NOT change is evidence. There used to be an
# `evidence_depth` field here -- minimal, standard, thorough -- and it was a
# field that read as though it controlled something and could not: gates are
# selected by the conditions a change meets, and the rule two lines below
# forbids a mode from switching one off. A FAST change that alters a visible
# surface still gets the user_interface gates, and the question of whether a
# HUMAN must satisfy one is answered by documentation-policy.yaml, not here.
#
# It was removed on 2026-09-20, after the first real FAST run: a two-line CSS
# fix selected eleven gates including a manual pass, `evidence_depth: minimal`
# said otherwise, and nothing read it. A field nobody reads is worse than an
# absent one, because it answers a question in the reader's head that the
# framework has not actually answered.
#
# What a mode NEVER changes:
#
#   - which gates apply. That is decided by the conditions the change meets,
#     in `quality-gates.yaml`, and a mode cannot switch a gate off. FAST is
#     not permission to skip a security review; it is the statement that no
#     condition requiring one was met.
#
# AN AGENT SET IS NOT A GATE LIST. `always_consider` is a PLANNING default:
# it says which agents are staffed up front, before anybody knows what the
# change turned out to touch. It does not say which gates apply, and an agent
# missing from it is not an agent that may not be invoked -- `devops-cicd`
# and `observability-sre` appear in no mode's set at all, and their three
# post-merge gates run for every feature in every mode. The general rule is
# that a gate whose owner the mode did not plan for still invokes that owner
# when the gate comes due.
#
# The one narrow exception is `owner_optional_closure` in `quality-gates.yaml`,
# which lets the Orchestrator close `requirements_ready` and
# `architecture_ready` in FAST on a written record rather than by standing up
# a requirements pass a one-package change has already answered. It is
# declared per gate, it is on no independent gate, and the record it demands
# is longer than the closure it permits -- deliberately, because the rationale
# IS the gate.
#   - independence. An implementation agent never closes its own gate, in any
#     mode.
#   - the four human gates.
#
# The mode is chosen by `risk-model.yaml` from the conditions the change
# meets. It is never chosen by preference, by deadline, or by how the last
# feature was run.
#
# THIS FILE ANSWERS "HOW MUCH MACHINERY", NEVER "WHEN". A second and
# unrelated question -- whether this feature's evidence-heavy acceptance
# gates run now or in a later validation batch -- is answered by
# `acceptance-batching.yaml`, and deliberately not by adding a fourth value
# here. That file's IMMEDIATE disposition is what "run everything now" meant
# before it existed; its BUILD disposition is unavailable the moment this
# file selects FULL, which is the whole of how the two files agree without
# either restating the other's list.

modes:
  FAST:
    summary: A small, isolated change whose blast radius is visible in the diff.
    # FAST is the only mode that trims the always-considered set, and it trims
    # exactly two: a separate requirements pass and a separate architecture
    # pass. Both are answering a question a one-package change has already
    # answered.
    always_consider:
      - engineering-orchestrator
      - impact-analysis
      - unit-test
      - code-reviewer
      - final-acceptance
    planning: >-
      Impact analysis only. No separate requirements or architecture pass -
      so `requirements_ready` and `architecture_ready`, which still apply,
      are closed by the Orchestrator under `owner_optional_closure` in
      quality-gates.yaml, with the rationale recorded in the plan.
    gate_reuse: permitted
    # FAST must be EARNED, not defaulted to. Every one of these must hold, and
    # the risk model refuses FAST if any signal at all is present.
    requires:
      - No floor signal and no elevating signal in risk-model.yaml.
      - The change stays inside one package, application or service.
      - No migration, and no change to a stored schema or policy.
      - No new runtime dependency.
      - No change to a contract another repository reads.

  STANDARD:
    summary: An ordinary product feature.
    always_consider:
      - engineering-orchestrator
      - impact-analysis
      - business-analyst
      - solution-architect
      - unit-test
      - code-reviewer
      - final-acceptance
    planning: Requirements and architecture pass before implementation.
    gate_reuse: permitted

  FULL:
    summary: A change at a boundary where being wrong is expensive or invisible.
    # STANDARD plus one: an independent architecture look, whether or not the
    # change crossed a package boundary. A boundary change that looks local is
    # the one worth a second pair of eyes, and it is precisely the case
    # `architecture_impact` does not catch.
    always_consider:
      - engineering-orchestrator
      - impact-analysis
      - business-analyst
      - solution-architect
      - architecture-reviewer
      - unit-test
      - code-reviewer
      - final-acceptance
    planning: Requirements, architecture and an explicit statement of the boundary at risk.
    # A review or a security gate that passed before the product code changed
    # says nothing about the code that exists now. In FAST and STANDARD that
    # judgement is made per gate by the invalidation matrix; in FULL the
    # matrix is not consulted for review and security gates -- they re-run.
    gate_reuse: restricted
    rationale_must_name_boundary: true

# FULL is not "run everything". The Orchestrator still selects the minimum
# sufficient set: the mode's always-considered agents, plus the agents the
# conditions bring in, and nothing else. A FULL feature that activates forty
# agents is the same defect as a FAST one that does.
never:
  - A mode may not switch off a gate whose condition is met.
  - A mode may not excuse a gate because it did not staff that gate's owner. It invokes the owner, or it closes the gate under `owner_optional_closure` and writes the record.
  - A mode may not waive independence.
  - A mode may not satisfy a human gate.
  - A mode may not be chosen to fit a schedule.

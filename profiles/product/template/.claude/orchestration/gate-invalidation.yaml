schema_version: 1

# When a passed gate may be trusted again, and when it must be run again.
#
# This is the change V2.1 exists for. V2 recorded nothing about a gate beyond
# whether it had passed, so there was no way to answer "did anything relevant
# to this change?" -- and with no answer, the only safe habit is to re-run
# everything, which is exactly what happened. One real lifecycle re-ran the
# browser suite five times, the evidence audit five times and manual QA six
# times, mostly to re-establish things nothing had touched.
#
# The rule is one sentence: A GATE IS INVALIDATED WHEN A CHANGE TOUCHES ONE
# OF ITS INPUTS, AND REUSED WHEN IT DOES NOT.
#
# The matrix is not written here. Each gate declares its own `inputs` in
# `quality-gates.yaml`, and the matrix is derived from them. A standalone
# change-class-to-gate table would be a second copy of that relationship, and
# it would be wrong the first time somebody added a gate and updated only one
# of the two.

# WHICH PATHS THESE GLOBS ARE WRITTEN AGAINST.
#
# Added 2026-09-21 for FW-GAP-006. The globs below are rooted -- `packages/**`
# means packages at the root, not packages anywhere -- and until this block
# existed nothing said what that root was. It is the generated product's.
#
# That was invisible for as long as the framework only ran inside a generated
# product. The moment the factory used it on its own product code, every path
# came out unclassified: the factory holds the same files under
# `profiles/product/template/`, and a rooted glob does not reach them. An
# unclassified diff produces no change classes, and no change classes means
# every gate reads as reusable -- so the classifier answered "nothing
# relevant changed" about a change to production code. G7 R2 hit exactly
# this, and made its gate decisions by hand rather than routing around it.
#
# The remedy is NOT to loosen the globs. `**/packages/**` would also claim
# `services/api/packages/`, `**/e2e/**` would claim a package's own `e2e/`
# directory, and `**/docs/**` would pull an application's documentation into
# the `documentation` class. Loosening deletes the rooting that gives each
# glob its meaning, and leaves the path domain exactly as undeclared as
# before.
#
# Instead the domain is declared once, and a path from anywhere else is
# mapped into it before it is matched. One vocabulary, one set of globs, one
# normalisation step in front of them.
path_domain:
  domain: the generated product repository root
  matched_against: the normalised path, never the raw one

  # Both rules say the same thing -- what a factory file BECOMES in a
  # product. A factory path is the product path it renders to, so it
  # classifies as the product path it renders to.
  normalise:
    # `profiles/product/template/packages/ui/x.tsx` -> `packages/ui/x.tsx`
    strip_path_prefix:
      - profiles/*/template/
    # `apps/web/globals.css.hbs` -> `apps/web/globals.css`. This rule earns
    # its place independently of the factory question: 179 of the product
    # template's application files carry the suffix, and an extension-matched
    # class cannot see through it. `README.md.hbs` classified as nothing.
    strip_filename_suffix:
      - .hbs
    also: a backslash separator is read as a forward slash

  # FAIL CLOSED. A path that matches nothing is not a path that changed
  # nothing, and the difference is the whole of FW-GAP-006: the empty set of
  # classes invalidates no gate, so an unclassified diff licenses reusing
  # every result in the feature. That was the default, and it is the most
  # dangerous one available.
  unclassified:
    means: The path is outside the declared domain, or the vocabulary has a hole in it.
    treat_as: stop
    who_decides: a human
    never:
      - Reading an unclassified path as "nothing relevant changed".
      - Reusing a gate because the diff produced no classes.
      - Adding a glob to silence one file without first asking which domain it is in.
  # KNOWN HOLES, counted rather than described. A fail-closed rule whose
  # holes are unnamed turns every one of them into a surprise stop, and the
  # first draft of this block claimed there were two when measurement found
  # forty-two. The number is stated so that it moves when anything changes.
  #
  # Measured 2026-09-21 over every tracked file in all three template trees
  # -- 807 distinct paths, of which 786 reach a product: 19 unclassified,
  # in three groups.
  #
  #   1. The framework's own contract -- `.claude/orchestration/*.yaml`,
  #      `.claude/domain/*.yaml`. 15 files, and the group this very file
  #      belongs to. Whether a change to the orchestration contract is a
  #      change class of its own is a real question and not an oversight.
  #      (FW-GAP-013)
  #   2. Repository hygiene -- `.gitattributes`, `.gitignore`, `.gitleaks.toml`.
  #      3 files. (FW-GAP-013)
  #   3. `contracts/product-platform.v1.json`, the contract the Control Plane
  #      reads. Arguably its own class, since changing it is the one edit here
  #      that another repository can observe. (FW-GAP-013)
  #
  # And outside the template trees entirely:
  #   - the factory's own source, generators/ and tooling/, which is outside
  #     the domain rather than missing from it (FW-GAP-011)
  #   - a Node test under the factory's root tests/ tree, which `tests/**`
  #     reaches before the Node patterns and classes as Python (FW-GAP-012)
  #
  # All three register rows are open. This block fixes none of them; it
  # stops them being discovered one stop at a time.
  #
  # UPDATED 2026-09-24, not re-measured from scratch: `acceptance-batching.yaml`
  # joined `.claude/orchestration/` for ADR 0011, and the same fail-closed rule
  # that stops an unclassified path from being read as "nothing relevant
  # changed" also refuses to let a comment quietly go stale about how many
  # there are. Group 1 is 16 files now, and the total is 20. The other two
  # groups, and the two out-of-domain holes below, are unaffected.
  known_unclassified_groups: 3
  known_unclassified_files_in_templates: 20

# What kind of thing changed. Distinct from `conditions.yaml`, which
# describes the FEATURE; a change class describes one EDIT. A feature that
# meets `user_interface` can perfectly well produce an edit whose only class
# is `documentation`, and the whole point of this file is that the second
# fact does not inherit the consequences of the first.
#
# A path belongs to the most specific class that matches it. The order below
# is that order, most specific first.
change_classes:
  feature_scope:
    paths:
      - docs/features/*/requirements/**
      - docs/features/*/design/**
    means: What the feature is for, and what it was agreed to be.

  manual_evidence:
    paths:
      - docs/features/*/testing/manual/**
    means: What a person executed, and what they saw.

  documentation:
    paths:
      - docs/**
      - '*.md'
      - '**/*.md'
    means: Prose, other than the feature's own scope and evidence.

  database_migration_or_policy:
    paths:
      - supabase/migrations/**
      - '**/*.sql'
    means: Schema, policy, index or data shape.

  e2e_test:
    paths:
      - e2e/**
    means: A browser test.

  automated_test_python:
    paths:
      - tests/**
      - '**/test_*.py'
      - '**/*_test.py'
    means: A Python test.

  automated_test_node:
    paths:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/__tests__/**'
    means: A Node test.

  deployment_config:
    paths:
      - .github/workflows/**
      - infrastructure/**
      - '**/fly.toml'
      - '**/vercel.json'
      # The whole local stack, not only `local/config/**`. Measured on
      # 2026-09-21 over the 786 distinct paths a product receives: 32 under
      # `local/` matched nothing -- the compose file, the proxy, the
      # observability collectors, the queue configuration, and every one of
      # the 19 scripts, `migrate.sh` and `register-with-control-plane.sh`
      # among them. "How a service is built, configured, deployed or run" is
      # exactly what those are, and the narrower glob was an accident of the
      # order things were written.
      - local/**
      # The build graph -- AT THE ROOT, and the anchoring is the whole point.
      #
      # Written as `**/tsconfig*.json` this took 26 files away from
      # `frontend_code`: every application's and package's own tsconfig, plus
      # `packages/ui/turbo.json`. `deployment_config` invalidates 5 gates and
      # `frontend_code` invalidates 16, so an edit to `packages/ui/tsconfig.json`
      # -- which can change how every frontend file compiles -- would have
      # reused the test, browser, accessibility and independent-review gates.
      #
      # That is FW-GAP-006's own failure mode, reintroduced by FW-GAP-006's
      # fix, and it is the third time in this one cycle that a remedy produced
      # the next defect. Caught by final acceptance measuring class movement
      # rather than reading the regression document, which asserted the
      # opposite. A per-package build file belongs to its package.
      - turbo.json
      - tsconfig*.json
      - eslint.config.mjs
      - playwright.config.ts
      - Makefile
    means: How a service is built, configured, deployed or promoted.

  dependency:
    paths:
      - '**/package.json'
      - pnpm-lock.yaml
      # Workspace membership is a dependency fact: adding a package here is
      # what makes it resolvable at all.
      - pnpm-workspace.yaml
      - '**/pyproject.toml'
      - uv.lock
    means: What the code depends on.

  # Above `backend_code`, deliberately, and only because of the two
  # stylesheet globs. Everything else here is decided by directory, and the
  # two classes share no directory -- so the order between them changed
  # nothing except this: a stylesheet is classified by what it is, not by
  # which service happens to serve it.
  #
  # A stylesheet under `services/` used to read as `backend_code`. That
  # invalidates the API gates and leaves `accessibility_pass` and
  # `screenshot_evidence_complete` standing, which is precisely backwards
  # for a file whose only job is how something looks. Absence would have
  # been safer than that, and absence is what the gap register recorded;
  # measuring it on 2026-09-21 found the misclassification instead.
  #
  # Honest about its own reach: no such file exists in either template tree
  # today, and measuring the old vocabulary against the new over every
  # tracked path changed the class of exactly nothing. Every stylesheet in
  # the estate already classified correctly, by directory. This rule is
  # written for the one somebody adds next, and it is recorded as costing
  # nothing today rather than presented as a fix to a live defect.
  frontend_code:
    paths:
      - apps/**
      - packages/**
      - '**/*.css'
      - '**/*.scss'
    means: Client-side production code, including anything that decides how a surface looks.

  backend_code:
    paths:
      - services/**
      - python-packages/**
    means: Server-side production code.

# What is written down when a gate passes, so that reuse is a claim about
# facts rather than about memory.
#
# Deliberately NOT a machine-written store in V2.1 -- that is a later step,
# and building the store before the contract is how the store ends up
# recording the wrong fields. What matters now is that every field needed to
# answer "may this be reused?" is named, and that none of them is "how
# thorough it felt".
gate_result:
  fields:
    gate: The gate id, from quality-gates.yaml.
    status: One of the statuses declared in quality-gates.yaml.
    commit_sha: The commit the gate ran against.
    change_classes: The classes present in the tree at that commit, for this feature.
    evidence: Where the executed output actually is.
    timestamp: When it ran.
    environment: Where it ran, for anything that touched a running system.
    command: What was executed, verbatim, for anything automated.
  # A field nobody could check is not evidence. Each of these can be checked
  # against something outside the record: the commit exists, the file exists,
  # the command can be run again.

reuse:
  rule: >-
    A recorded PASS may be reused for the current change when no change class
    present in that change appears in the gate's `inputs`, and the recorded
    result is not older than the current code freeze.
  requires:
    - the recorded result is PASS
    - no input class of the gate is among the change's classes
    - the evidence the record points at still exists
    - the result is not older than the current code freeze
  never_reused:
    - A result whose evidence cannot be produced on request.
    - A result from a different feature, branch or environment.
    - A FAIL or a BLOCKED. Only a PASS is reusable; the others are re-run or escalated.
  not_a_reason:
    - elapsed time
    - that the gate is slow, flaky or expensive
    - that the last run was thorough
    - that nobody expects the result to have changed
  # The last one is the whole discipline. "Nobody expects it to have changed"
  # is a prediction; "no input class changed" is a fact about the diff.

# FULL restricts reuse rather than forbidding it. The restriction is the code
# freeze: in FULL, a review or security result from before the current freeze
# is not reused even when no input class changed, because at a boundary the
# question is not only "did the inputs change" but "has anyone looked at this
# arrangement as it now stands".
mode_overrides:
  FAST: { reuse: permitted }
  STANDARD: { reuse: permitted }
  FULL:
    reuse: restricted
    restriction: A result recorded before the current code freeze is not reused, whatever its inputs.

# A failure with a proven, narrow root cause does not restart the feature.
#
# The E18-F01 case exactly: a browser test asserted something untrue, the fix
# was to the browser test, and what followed was a full lifecycle re-run. The
# Python suite, the Node suite, the row-level security suite, the security
# review, manual QA, accessibility and regression were all re-established
# against code that had not moved.
targeted_remediation:
  when:
    - the root cause is established, not suspected
    - the change needed is narrow and its classes are known
    - no floor signal in risk-model.yaml is touched by the fix
  report:
    - the root cause, and the evidence for it
    - the scope affected
    - the scope actually changed, by change class
    - the gates invalidated, and why
    - the gates reused, and the input classes that were untouched
    - the validation now required
    - whether a human decision is needed
  never:
    - Widening the fix because the area was open anyway.
    - Reusing a gate whose inputs the fix touched, because the fix was small.
    - Treating remediation as a fresh feature with a fresh budget. Counters carry over.

# Worked cases, asserted mechanically by the orchestration test rather than
# left as illustration. Each names the classes of one edit and the gates that
# must come out invalidated.
scenarios:
  documentation_only_correction:
    change_classes: [documentation]
    # CI is in the list because this repository's pipeline runs the
    # documentation tests: a prose-only change really can turn it red. It is
    # also one pipeline run, which is the cheap half of the bill - what this
    # scenario saves is the manual pass, the accessibility pass and the
    # reviews.
    invalidates: [documentation_audit, ci_verified, final_acceptance]
    reuses_must_include:
      - automated_tests_pass
      - e2e_pass
      - manual_qa_pass
      - accessibility_pass
      - security_review
      - independent_code_review
      - regression_pass
      - documentation_complete

  e2e_test_only_correction:
    change_classes: [e2e_test]
    invalidates: [e2e_pass, ci_verified, final_acceptance]
    # Everything the E18-F01 remediation re-ran and did not need to. The
    # row-level security suite is covered by api_integration_tests_pass and
    # security_review, which is where RLS is actually verified in this
    # estate - named here so that "reuse RLS" is not quietly dropped for
    # want of a gate with that word in it.
    reuses_must_include:
      - automated_tests_pass
      - api_integration_tests_pass
      - manual_qa_pass
      - accessibility_pass
      - screenshot_evidence_complete
      - qa_evidence_audit
      - security_review
      - architecture_review
      - independent_code_review
      - regression_pass
      - documentation_complete

  backend_change:
    change_classes: [backend_code]
    invalidates:
      - implementation_complete
      - automated_tests_pass
      - api_integration_tests_pass
      - e2e_pass
      - manual_qa_pass
      - independent_code_review
      - architecture_review
      - security_review
      - privacy_review
      - ai_evaluation
      - domain_review
      - qa_evidence_audit
      - documentation_complete
      - regression_pass
      - ci_verified
      - environment_verified
      - final_acceptance
    reuses_must_include:
      - requirements_ready
      - impact_analyzed
      - architecture_ready
      - screenshot_evidence_complete
      - accessibility_pass
      - documentation_audit
      - deployment_preflight

  frontend_change:
    change_classes: [frontend_code]
    reuses_must_include:
      - requirements_ready
      - impact_analyzed
      - architecture_ready
      - api_integration_tests_pass
      - privacy_review
      - documentation_audit
    invalidates_must_include:
      - accessibility_pass
      - screenshot_evidence_complete
      - e2e_pass
      - independent_code_review

  migration_or_policy_change:
    change_classes: [database_migration_or_policy]
    invalidates_must_include:
      - api_integration_tests_pass
      - security_review
      - privacy_review
      - impact_analyzed
      - architecture_ready
      - regression_pass

  deployment_config_only:
    change_classes: [deployment_config]
    # No product gate. The artefacts did not change, so re-running the
    # product's tests would prove something nobody doubted. What it does
    # invalidate is the deployment's own gates.
    invalidates_must_include:
      - deployment_preflight
      - environment_verified
    reuses_must_include:
      - automated_tests_pass
      - e2e_pass
      - manual_qa_pass
      - independent_code_review
      - security_review
      - regression_pass

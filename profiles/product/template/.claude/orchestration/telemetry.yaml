schema_version: 1

# What a run reports about itself when it finishes.
#
# Engineering telemetry, not product analytics: it is about how the framework
# executed, it contains no customer data, and nothing collects or transmits
# it. The Orchestrator prints it at the end of a run and it goes in the
# feature's release notes.
#
# It exists because V2.1's central claims are quantities, and V2 could not
# produce one of them. "Too many reviews" was an impression. "Five reviewer
# cycles, two of them after the code had stopped changing" is a fact somebody
# can act on -- and so is "eleven gates reused, none re-run unnecessarily",
# which is the claim this framework most needs to be held to.
#
# Deliberately not a store, a dashboard or a time series. One report, at the
# end of one run, in the place the run is already being written up. Anything
# more is an observability platform for a process that runs a few times a
# week.

# HOW A COUNT COMES TO EXIST, which V2.1 did not say.
#
# The rules below already forbade inventing a number. They did not say when a
# number may be written down, and that turned out to be the same defect wearing
# a different hat: in G7 R1 a final count was written BEFORE the event it
# counted had happened. Nothing was fabricated -- the plan was simply recorded
# as though it were the history, and by the time the event occurred the summary
# already said what it would be. A summary written ahead of the thing it
# summarises is a prediction, and a prediction stored in the place a fact goes
# is worse than no fact at all.
#
# So the report is derived rather than kept. Three pieces:
#
#   events      what happened, appended as it happened, never edited
#   amendments  a correction, appended, naming what it corrects
#   summary     computed from the two, after the last applicable event
#
# The same shape as `evidence_runs` in documentation-policy.yaml, and for the
# same reason: the only thing a record is for is the ability to check later
# what actually happened, and a record that can be revised cannot do that.

# APPEND-ONLY. An event is written when the thing occurs, and it is immutable
# once written. Not when the thing is planned, not when it is expected to
# finish, and not in a batch at the end from memory.
events:
  append_only: true
  written_when: the event occurs, not when it is planned and not when the run ends
  immutable_once_written: true
  each_event_records:
    - event            # what happened, from `event_kinds`
    - subject          # the gate, agent, loop, state or component it concerns
    - outcome          # the status, count or verdict, where the event carries one
    - at               # timestamp
    - source           # what observed it, so a reader can go and look
  event_kinds:
    - mode_selected
    - agent_invoked
    - gate_executed
    - gate_reused
    - gate_invalidated
    - gate_closed_owner_optional   # the closure record in quality-gates.yaml
    - loop_iteration
    - budget_cap_reached
    - escalation_raised
    - human_gate_reached
    - lifecycle_state_reached
    - deployment_component_state
  never:
    - Writing an event before it happens.
    - Editing an event after it is written. A correction is an amendment.
    - Reconstructing the log at the end of a run from what the plan said.
    - Deleting an event because the thing it records was later undone. It still happened.

# A CORRECTION IS A NEW RECORD. The wrong value stays visible, because the
# fact that it was once recorded wrongly is itself worth knowing -- it is how
# a reader learns which numbers in this framework are shaky.
amendments:
  append_only: true
  silent_rewrite_forbidden: true
  each_amendment_records:
    - at                # when the correction was made
    - amends            # the event, or the field of it, being corrected
    - previous_value    # what was recorded before
    - corrected_value   # what it should have said
    - reason            # why it was wrong
    - evidence          # what establishes the corrected value
  never:
    - Amending an event by editing it.
    - An amendment with no evidence. That is a second guess, not a correction.
    - Amending the summary. The summary is derived; amend the event it came from.

# DERIVED, AND LAST. The summary is a view over events plus amendments, and it
# is generated after the final applicable lifecycle or gate event -- CLOSED for
# a feature that reaches it, or the escalation for one that stops. It is not
# the historical source of truth and nothing reads it as one: a disagreement
# between the summary and the log is resolved in favour of the log, every time.
#
# THE SUMMARY IS A CLOSURE ARTIFACT, and this was not said until 2026-09-21.
#
# FW-GAP-010: the rule above and the `final_acceptance` gate could not both be
# satisfied. Acceptance is a gate, so running it produces events. Generate the
# summary before acceptance and it is stale the moment acceptance runs, and it
# was generated with an applicable event outstanding, which this file forbids.
# Generate it after, and the acceptance agent meets an unfinished document and
# Definition of Done item 7 is unmet. No ordering satisfied both. G7 R2 held a
# verdict on exactly this: the summary reported zero human escalations while
# the log recorded one, and it was wrong because acceptance had happened since
# it was written.
#
# It is R1's own remedy producing R2's deadlock. FW-GAP-003 was raised because
# a final count was written BEFORE the event it counted; the fix was to derive
# the summary after the last event, and nobody noticed acceptance is an event.
#
# Ruled by the repository owner and written down here rather than left in a
# findings document. The ordering is:
#
#   gates ... -> final_acceptance    judges the log and the primary evidence
#             -> human gates, escalations, amendments   append events
#             -> terminal state reached                 CLOSED, or the escalation
#             -> the summary is finalised               the last act of the run
#
# This moves finalisation strictly LATER, never earlier, so it cannot reopen
# FW-GAP-003. A draft generated at any earlier point is not the artifact this
# block binds -- `regenerating_is_safe` is already true, and a draft is a
# reading, not a record.
derived_summary:
  derived_from: [events, amendments]
  generated_after: the final applicable lifecycle or gate event for the run
  finalised_at: the terminal state -- CLOSED, or the escalation for a run that stops there
  finalised_after_acceptance: true
  is_closure_artifact: true
  is_source_of_truth: false
  source_of_truth: the event log
  regenerating_is_safe: true
  # What acceptance judges, said here as well as in quality-gates.yaml,
  # because the deadlock was two files each assuming the other's answer.
  not_an_input_to: final_acceptance
  never:
    - Generating the FINAL summary while an applicable event is still outstanding.
    - Recording a value in it that no event supports.
    - Treating it as the record. It is a reading of the record.
    - Holding acceptance because the summary is not finished. It is not finished until after acceptance, by design.
    - Closing a run whose summary was never finalised, or whose summary disagrees with the log.

# UNKNOWN IS A VALUE. Zero is a measurement and means the thing was watched
# for and did not happen; UNKNOWN means nobody watched. Reporting the second
# as the first is the quietest way this report can lie, because zero is also
# the answer everybody hopes for.
unknown:
  when: no event supports a value for the metric
  render_as: UNKNOWN
  zero_requires: an event record from which zero actually follows
  never:
    - Defaulting an untracked metric to 0.
    - Inferring a count from the plan when no event recorded it.
    - Omitting a metric that is UNKNOWN. An absent row reads as nothing to report.

report:
  routing:
    - execution_mode
    - risk_signals_fired
    - risk_signals_rejected
    - mode_overridden_by_human
  agents:
    - agents_invoked
    - invocations_per_agent
    # The number the whole framework is judged on. Forty exist; a feature
    # that used eight and needed eight is the result being aimed at.
    - agents_available_but_not_activated
  gates:
    - gates_executed
    - gates_reused
    - gates_invalidated
    - gates_not_applicable
    - gates_not_applicable_by_policy
  loops:
    - test_fix_cycles
    - reviewer_cycles
    - documentation_audits
    - final_acceptance_attempts
    - retries
    - remediation_cycles
    - budget_caps_reached
    - human_escalations
  lifecycle:
    - state_reached
    - states_not_applicable
    - deployment_components_by_state
  effort:
    - elapsed_time_if_available

rules:
  - Reported at the end of a run, and reported honestly. A run that escalated reports the escalation, not the work that preceded it.
  - Counts come from what happened, never from what the plan said would happen. A plan that predicted two reviews and got five reports five.
  - No customer data, no personal data, no secret, and no configuration value.
  - Nothing is collected, transmitted or stored outside the repository.
  - A count that was not tracked is reported as unknown, not as zero. Zero is a measurement.
  - Every count in the report is derived from the event log. A number with no event behind it is UNKNOWN.
  - An event is appended when it happens. The final summary is generated after the last applicable event, never before.
  - Acceptance judges the event log and the primary evidence. It never judges the summary, which does not exist in final form until after acceptance has run.
  - The summary is finalised once the run reaches its terminal state, and closure requires it to exist and to agree with the log.
  - A correction is an amendment that names what it corrects and why. Nothing recorded is ever rewritten in place.

# The comparison worth making, once there are several runs to compare. Not
# automated here -- that is a later step, and automating a comparison before
# anybody has looked at two reports by hand is how the wrong thing gets
# measured precisely.
worth_comparing:
  - gates reused against gates executed, which is whether reuse is actually working
  - reviewer cycles against the cap, which is whether the cap binds or merely exists
  - the mode selected against the gates that turned out to matter, which is whether the risk model is right
  - agents activated against agents that produced a finding, which is whether routing is minimal or merely smaller

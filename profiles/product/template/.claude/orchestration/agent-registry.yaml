schema_version: 1

# The shared engineering agent catalog for a KORAS product repository.
#
# These are reusable role definitions, not persistent processes. Almost all of
# them are dormant for any given feature: the Engineering Orchestrator selects
# the minimum set that the feature type, its risk and the Definition of Done
# actually require. Invoking all 40 is a defect in orchestration.
#
# Product-specific domain agents are NOT listed here. They are product-owned
# overlays under `.claude/domain/`, registered in that directory's own
# registry, so that the shared catalog stays domain-neutral and identical
# across every KORAS product.
#
# `agent_count` is asserted against the number of entries below and against
# the number of files on disk by the orchestration validation test. It cannot
# drift from either without a test failing.

# What each agent is FOR, coarser than an agent and finer than a category.
#
# The Orchestrator asks "what capability does this change need?" before it
# asks "which agent?", which is the difference between selecting a minimum set
# and selecting a familiar one. Eighteen capabilities over forty agents is the
# useful middle: `category` is too coarse to route on -- it puts a unit test,
# a browser run and a manual pass in one bucket called `testing` -- and an
# agent id is too fine, because it is the answer rather than the question.
#
# Declared here so that it stays one vocabulary. An agent may not invent a
# capability, and a capability nothing supplies is deleted rather than kept:
# both are asserted, for the same reason `conditions.yaml` asserts them.
#
# Three requested routing fields are deliberately NOT stored here, because
# each is already recorded somewhere that cannot drift from the thing it
# describes, and a second copy is how the two come to disagree:
#
#   which gates an agent may close -> the `owner` field in quality-gates.yaml
#   which conditions activate it   -> activation-rules.yaml
#   whether it may block           -> blocking_severities plus the gate it owns
#
# The orchestration test derives all three and checks them against this file,
# so the router has the answers without this file having to repeat them.
capability_vocabulary:
  - coordinate               # run the plan; assign; enforce gates
  - plan_product             # recommend what to build next
  - analyse_impact           # what this change reaches
  - specify_requirements     # what done means, in acceptance criteria
  - design_solution          # architecture, data, security or experience design
  - implement                # write production code
  - prepare_test_state       # fixtures, tenants, named accounts
  - verify_automated         # unit, component, API, integration
  - verify_browser           # a real browser, at real widths
  - verify_human             # a person executing steps, including accessibility
  - verify_nonfunctional     # performance, security testing, AI evaluation
  - verify_integration       # the converged result, not each branch
  - triage_failure           # route a failure to the owner of the defect
  - review_independent       # judge work somebody else did
  - record_evidence          # write down what was executed, from what happened
  - document                 # what a user or operator must now know
  - deliver                  # migration, pipeline, observability, release
  - accept                   # walk the Definition of Done and report

developer_pool:
  workers: [developer-1, developer-2, developer-3]
  max_parallel: 3
  isolation: git-worktree
  # The canonical Koras worktree location, deliberately OUTSIDE the repository.
  # A worktree created inside the repository -- and `.claude/` in particular --
  # is copied into every generated project as part of a shared asset. One
  # existed on 2026-09-15 and shipped a second copy of the starter, .git file
  # and half-finished branch included.
  worktree_root: ../.koras-worktrees
  worktree_path: ../.koras-worktrees/<repository>/<feature-id>
  branch_pattern: feature/<feature-id>-<slug>
  rules:
    - One worker, one worktree, one branch, one feature at a time.
    - Two workers never share a working directory or a branch.
    - The Orchestrator performs file-overlap and contract-overlap analysis before assigning concurrent work.
    - Features that overlap on files, contracts or migrations are sequenced, not parallelized.
    - A worker never merges, rebases onto a protected branch, force-pushes or deploys.


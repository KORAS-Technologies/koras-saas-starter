schema_version: 1

# The shared engineering agent catalog for a KORAS product repository.
#
# These are reusable role definitions, not persistent processes. Almost all of
# them are dormant for any given feature: the Engineering Orchestrator selects
# the minimum set that the feature type, its risk and the Definition of Done
# actually require. Invoking all 40 is a defect in orchestration.
#
# Product-specific domain agents are NOT listed here. They are product-owned
# overlays under `.claude/domain/`, registered in that directory's own
# registry, so that the shared catalog stays domain-neutral and identical
# across every KORAS product.
#
# `agent_count` is asserted against the number of entries below and against
# the number of files on disk by the orchestration validation test. It cannot
# drift from either without a test failing.

developer_pool:
  workers: [developer-1, developer-2, developer-3]
  max_parallel: 3
  isolation: git-worktree
  # The canonical Koras worktree location, deliberately OUTSIDE the repository.
  # A worktree created inside the repository -- and `.claude/` in particular --
  # is copied into every generated project as part of a shared asset. One
  # existed on 2026-09-15 and shipped a second copy of the starter, .git file
  # and half-finished branch included.
  worktree_root: ../.koras-worktrees
  worktree_path: ../.koras-worktrees/<repository>/<feature-id>
  branch_pattern: feature/<feature-id>-<slug>
  rules:
    - One worker, one worktree, one branch, one feature at a time.
    - Two workers never share a working directory or a branch.
    - The Orchestrator performs file-overlap and contract-overlap analysis before assigning concurrent work.
    - Features that overlap on files, contracts or migrations are sequenced, not parallelized.
    - A worker never merges, rebases onto a protected branch, force-pushes or deploys.


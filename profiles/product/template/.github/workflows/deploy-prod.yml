name: Deploy — PROD

# Production deploys on a push to main, and the `prod` GitHub environment
# carries the required reviewers. The gate lives there rather than in this
# file so that changing who may approve a production release is not a code
# change reviewable by the person seeking the approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit

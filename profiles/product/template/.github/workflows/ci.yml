name: CI

on:
  push:
    branches: [develop, test, staging, main]
  pull_request:
    branches: [develop, test, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck

  test-node:
    name: Test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # --all-packages installs every workspace member. A bare `uv sync` brings
      # in only the root dev tools, leaving mypy unable to resolve fastapi,
      # pydantic and sqlalchemy -- and silently treating them as Any.
      - run: uv sync --all-packages
      - run: uv run ruff check .
      # Every service names its package `src`, so a repo-wide run aborts on
      # duplicate modules. Check one root at a time, as `make typecheck` does.
      - run: uv run mypy python-packages
      - run: |
          for svc in services/*/; do
            [ -f "$svc/pyproject.toml" ] || continue
            echo "mypy $svc"
            uv run mypy "$svc"
          done
      - run: uv run pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

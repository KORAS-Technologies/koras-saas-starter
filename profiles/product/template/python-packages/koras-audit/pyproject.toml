[project]
name = "koras-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["koras-auth","koras-tenant","koras-logging"]

[tool.uv.sources]
koras-auth = { workspace = true }
koras-tenant = { workspace = true }
koras-logging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_audit"]

[project]
name = "koras-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["litellm>=1.44.0","koras-auth","koras-logging"]

[tool.uv.sources]
koras-auth = { workspace = true }
koras-logging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_ai"]

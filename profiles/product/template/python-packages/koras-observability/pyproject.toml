[project]
name = "koras-observability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opentelemetry-api>=1.25.0","opentelemetry-sdk>=1.25.0","koras-logging"]

[tool.uv.sources]
koras-logging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_observability"]

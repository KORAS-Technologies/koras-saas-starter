[project]
name = "koras-storage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34.0","koras-auth","koras-tenant"]

[tool.uv.sources]
koras-auth = { workspace = true }
koras-tenant = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_storage"]

[project]
name = "koras-tenant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["koras-auth", "sqlalchemy>=2.0.0"]

[tool.uv.sources]
koras-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_tenant"]

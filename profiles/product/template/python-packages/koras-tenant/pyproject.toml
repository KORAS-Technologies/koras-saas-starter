[project]
name = "koras-tenant"
version = "0.1.0"
requires-python = ">=3.12"
# koras-database for the declaration guard: this package supplies the
# vocabulary, that one supplies the mechanism that refuses without it.
dependencies = ["koras-auth", "koras-database", "sqlalchemy[asyncio]>=2.0.0"]

[tool.uv.sources]
koras-auth = { workspace = true }
koras-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_tenant"]

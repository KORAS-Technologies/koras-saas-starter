[project]
name = "koras-settings"
version = "0.1.0"
requires-python = ">=3.12"
# No dependencies, deliberately.
#
# `koras-reporting` needs pydantic for the result shape it answers with and two
# writers for its exports. This package answers with dataclasses and writes
# nothing: a definition is declared in code, a value arrives as JSON the caller
# already parsed, and the resolver is a pure function over three mappings. The
# API turns the answer into a response model, because that is the API's job and
# a response model is its published contract rather than this package's.
#
# Keeping it empty is what lets the same catalogue be described once and read
# from two different schemas -- a product's tenant tables and the platform's
# per-product defaults -- without either side inheriting the other's driver.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_settings"]

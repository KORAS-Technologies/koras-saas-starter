[project]
name = "koras-reporting"
version = "0.1.0"
requires-python = ">=3.12"
# pydantic for the result shape the API answers with, and nothing else. The
# framework runs no query: a resolver is a coroutine the product or the
# platform supplies, and the session it is handed is theirs. Keeping a
# database driver out of here is what lets the Control Plane and a product
# describe a report with one package and read it from two different schemas.
dependencies = [
  "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koras_reporting"]

name: CI

on:
  push:
    branches: [develop, test, staging, main]
  pull_request:
    branches: [develop, test, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, not just the tip. A credential committed and then
          # removed in a later commit is still published -- the fix is rotation,
          # and this is what tells us rotation is needed.
          fetch-depth: 0
      # The gitleaks binary is MIT-licensed; only the marketplace action wrapper
      # requires a paid licence for organizations, and it refuses to run without
      # one. Installing the scanner directly gets the scanning without the
      # billing relationship, and pins the version so a new rule set cannot
      # break an unrelated pull request overnight.
      - name: Install gitleaks
        run: |
          version=8.28.0
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL -o /tmp/gitleaks.tar.gz "$base/v$version/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan history for secrets
        # --max-archive-depth because the default is 0: gitleaks does not look
        # inside archives at all unless asked. It decides what is an archive from
        # the file extension, so this catches a committed .zip or .tar.gz and does
        # NOT catch an extensionless one -- which is how Terraform names a plan
        # file, and how a plan holding four database passwords and four OIDC
        # client secrets got past a scan like this one. The path rule in
        # tests/security/test_no_state_artifacts.py covers what this cannot.
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --max-archive-depth 3

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck

  test-node:
    name: Test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # --all-packages installs every workspace member. A bare `uv sync` brings
      # in only the root dev tools, leaving mypy unable to resolve fastapi,
      # pydantic and sqlalchemy -- and silently treating them as Any.
      - run: uv sync --all-packages
      - run: uv run ruff check .
      # One pass over everything. This used to be a loop over service roots,
      # because every service named its package `src` and a repo-wide run
      # aborted on duplicate modules. They are named after themselves now, so
      # the loop -- and the chance of a service being silently skipped by it --
      # is gone.
      - run: uv run mypy python-packages services
      - run: uv run pytest

  # The one job here that opens a browser.
  #
  # Every other job asserts structure. This one asserts behaviour that a text
  # search reads as present and a keyboard finds missing: in a product, the
  # shell's focus trap and Escape returning focus; in the Control Plane, the
  # admin middleware, which runs before routing and so is the one authorisation
  # layer no unit test can reach.
  #
  # It costs minutes, and on a private repository minutes are paid — so it is a
  # deliberate spend rather than an oversight. `pnpm e2e` builds what it needs
  # and Playwright owns the server's lifecycle, so nothing here has to start or
  # stop anything.
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:install
      - run: pnpm e2e
      # The trace that explains a failure. Uploading a report directory the
      # reporter never produced is how the Control Plane's own suite spent
      # months being diagnosed from a text log; `playwright.config.ts` writes
      # this one under CI.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
